# OpenTelemetry Collector Builder (OCB) manifest for the Avuru gateway —
# a MINIMAL distro: only the components we actually use. Versions are pinned
# together with agent_docs/tech_stack.md (collector 0.154.0 line); a collector
# upgrade is a deliberate MR that re-runs the ClickHouse DDL contract freeze
# (gateway/schemas/README.md). Build: gateway/Dockerfile (`make gateway-image`).
dist:
  name: avuru-gateway
  description: Avuru Obs minimal OTel Collector gateway
  output_path: ./build
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.154.0
  # Sentry-protocol ingest (error-tracking module): accepts Sentry SDK
  # envelopes and emits OTel log records the hub derives issues from. Built
  # from the in-repo module via the replaces entry below.
  - gomod: github.com/avuru/avuru-obs/gateway/sentryreceiver v0.1.0
  # Wider ingest compatibility (design/2026-07-27-wider-ingest-compat.md): the
  # binary always carries these; only chart-rendered config wires a listener
  # (each behind its gateway.receivers.* flag, default off). Jaeger's UDP
  # thrift protocols stay unconfigured — no auth hook, deprecated agent.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jaegerreceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/zipkinreceiver v0.154.0
  # Remote-Write v2 ONLY at this line: v1 payloads get HTTP 415; senders need
  # Prometheus >= 3.8.0 with protobuf_message io.prometheus.write.v2.Request.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusremotewritereceiver v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/lokireceiver v0.154.0
  # Mesh control-plane scrape (design/2026-08-25-mesh-surfaces.md): istiod
  # publishes Prometheus metrics on :15014, and this is the only place in the
  # product that can scrape it CORRECTLY. The sensor's prometheus receiver runs
  # in a DaemonSet against 127.0.0.1, which is right for the per-node energy
  # sidecars and wrong for a single Deployment — every node would produce its
  # own copy of every control-plane series. The gateway is already the
  # single-writer half of the pipeline.
  #
  # This is the largest component in an otherwise deliberately minimal distro.
  # The alternative, a dedicated single-replica scraper Deployment, trades that
  # weight for another workload, ServiceAccount and failure mode; one receiver
  # in a collector that already exists is the cheaper of the two.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.154.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.154.0
  # resource/tenant: stamps avuru.tenant per environment (gateway.tenant in
  # the chart) — the ingest half of the per-project model.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.154.0
  # transform/tenant: maps k8s.namespace.name -> avuru.tenant
  # (gateway.tenantByNamespace in the chart) so one shared-cluster install can
  # split environments into projects; resource/tenant stays the static
  # fallback for unmatched telemetry.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.154.0
  # tenantfromauth: in enforce mode, overwrites avuru.tenant from the ingest
  # key's validated project (attached by the avuruingestauth extension). MUST be
  # placed before batch in the pipeline — batch discards the request context.
  # Built from the in-repo module via the replaces entry below.
  - gomod: github.com/avuru/avuru-obs/gateway/tenantfromauth v0.1.0
  # tailsamplingprocessor added when the sampling knob ships (post-v0.1 default is 100% ingest)

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.154.0
  # Dual-write forwarding during migrations (gateway.forward.* in the chart,
  # default off): OTLP in both transports (grpc + http for HTTP-only egress)
  # and Kafka. Forward exporters are always rendered with a sending queue so a
  # dead legacy target can never backpressure the ClickHouse path.
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.154.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.154.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.154.0

extensions:
  # healthcheck lives in contrib (no core equivalent).
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.154.0
  # avuruingestauth: per-project ingest-key server authenticator (auth Plan C).
  # In-repo module; validates keys against the hub and — in enforce mode —
  # attaches the key's project as auth data for tenantfromauth. Built from the
  # replaces entry below.
  - gomod: github.com/avuru/avuru-obs/gateway/avuruingestauth v0.1.0
  # opampextension added with the v0.2 OpAMP server (hub-managed config)

# Local module: the Sentry receiver lives in-repo (gateway/sentryreceiver).
# The path is relative to the generated ./build/go.mod; the Dockerfile copies
# the module to /src/sentryreceiver so ../sentryreceiver resolves there too.
replaces:
  - github.com/avuru/avuru-obs/gateway/sentryreceiver => ../sentryreceiver
  # Local module: the ingest-key authenticator lives in-repo
  # (gateway/avuruingestauth). Same relative-path pattern as sentryreceiver; the
  # Dockerfile copies it to /src/avuruingestauth so ../avuruingestauth resolves.
  - github.com/avuru/avuru-obs/gateway/avuruingestauth => ../avuruingestauth
  - github.com/avuru/avuru-obs/gateway/tenantfromauth => ../tenantfromauth
  # Security floor: GHSA-hrxh-6v49-42gf (HIGH — gRPC-Go xDS RBAC / HTTP/2). The
  # collector 0.154.0 line resolves google.golang.org/grpc to v1.81.1, which the
  # image scan fails on; pin the fixed v1.82.1 in the distro. Drop this when a
  # collector bump carries v1.82.1+ on its own (revisit on the next OCB bump).
  - google.golang.org/grpc => google.golang.org/grpc v1.82.1
  # Security floor: CVE-2026-56852 (HIGH — golang.org/x/text norm.Iter infinite
  # loop on crafted input). The collector 0.154.0 line resolves golang.org/x/text
  # to v0.37.0, which the image scan fails on; pin the fixed v0.39.0. Drop this
  # when a collector bump carries v0.39.0+ on its own (revisit on the next OCB bump).
  - golang.org/x/text => golang.org/x/text v0.39.0
  # Security floor: CVE-2026-56854 (CRITICAL — golang.org/x/crypto/ssh
  # authentication bypass, source-address restrictions not enforced). The
  # collector 0.154.0 line resolves golang.org/x/crypto to v0.53.0, which the
  # image scan fails on; pin the fixed v0.55.0. This distro exposes no SSH
  # surface, so the pin closes a supply-chain finding rather than a reachable
  # hole — but an unfixable CRITICAL in the image is not something to carry.
  # Drop this when a collector bump carries v0.55.0+ on its own (revisit on the
  # next OCB bump).
  - golang.org/x/crypto => golang.org/x/crypto v0.55.0
