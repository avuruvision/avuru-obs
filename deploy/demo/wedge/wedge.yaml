# The wedge demo: a deliberately UNINSTRUMENTED HTTP chain —
# loadgen (busybox wget loop) -> frontend (nginx proxy) -> api (nginx),
# plus probe-canary (nginx with a tight CPU limit + aggressive liveness
# probe — the sensor-safety regression gate's subject).
# Zero OTel anywhere: no SDK, no env vars, no sidecars. If the service map
# lights up, it is the sensor's zero-code eBPF instrumentation doing it —
# that IS the product promise the TTV gate enforces (e2e/wedge_test.go).
# Images are tiny and pinned; e2e-helm.sh pre-loads them into kind so pull
# time stays out of the <5-minute clock.
apiVersion: v1
kind: Namespace
metadata:
  name: wedge-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wedge-demo
spec:
  selector: { app: api }
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: wedge-demo
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://api.wedge-demo.svc.cluster.local:80;
        proxy_http_version 1.1;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wedge-demo
spec:
  selector: { app: frontend }
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://frontend.wedge-demo.svc.cluster.local/ || true
                wget -q -O /dev/null http://probe-canary.wedge-demo.svc.cluster.local/ || true
                sleep 0.5
              done
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
---
# Probe-sensitive canary — reproduces the failure mode of
# docs/runbooks/app-probe-failures.md cause #1: a tight CPU limit (uprobe
# overhead is charged to THIS cgroup, not OBI's) under an aggressive
# livenessProbe. Deployed BEFORE the platform; the e2e regression gate
# asserts it stays Ready with 0 restarts through the post-install soak
# (AEP 2026-07-17). If it flakes WITHOUT the sensor (at the pre-install
# `kubectl wait`, or from install-time contention), the canary is mis-tuned —
# loosen cpu to 50m, then timeoutSeconds to 2, in that order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-canary
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: probe-canary }
  template:
    metadata:
      labels: { app: probe-canary }
    spec:
      containers:
        - name: probe-canary
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            # The tight limit IS the failure precondition — do not raise it
            # for comfort; the gate exists to prove the sensor survives it.
            limits: { cpu: 25m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: probe-canary
  namespace: wedge-demo
spec:
  selector: { app: probe-canary }
  ports:
    - port: 80
