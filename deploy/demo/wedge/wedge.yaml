# The wedge demo: a deliberately UNINSTRUMENTED 3-service HTTP chain —
# loadgen (busybox wget loop) -> frontend (nginx proxy) -> api (nginx).
# Zero OTel anywhere: no SDK, no env vars, no sidecars. If the service map
# lights up, it is the sensor's zero-code eBPF instrumentation doing it —
# that IS the product promise the TTV gate enforces (e2e/wedge_test.go).
# Images are tiny and pinned; e2e-helm.sh pre-loads them into kind so pull
# time stays out of the <5-minute clock.
apiVersion: v1
kind: Namespace
metadata:
  name: wedge-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wedge-demo
spec:
  selector: { app: api }
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: wedge-demo
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://api.wedge-demo.svc.cluster.local:80;
        proxy_http_version 1.1;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wedge-demo
spec:
  selector: { app: frontend }
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: wedge-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://frontend.wedge-demo.svc.cluster.local/ || true
                sleep 0.5
              done
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
