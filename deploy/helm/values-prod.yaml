# Production overrides for the avuruops chart. The chart stays agnostic; this file
# carries the environment. image.registry is injected by deploy.jenkinsfile
# (--set image.registry=$HARBOR_URL), so it is NOT set here.

clickhouse:
  persistence:
    # Pin your production block-storage StorageClass.
    storageClassName: ""
    size: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 8Gi

retention:
  traces: 14
  logs: 7

hub:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      memory: 512Mi

ui:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

gateway:
  replicas: 2
  tenant: production

sensor:
  # In production the sensor must lose every scheduling fight with user apps.
  priorityClass:
    create: true

# Green energy/carbon STAYS OFF in production until Kepler's metric names,
# config keys, port and RBAC are verified on this fleet's real RAPL hardware —
# a documented v1 limitation (design/2026-07-22-green-carbon.md) that blocks
# prod use; CI only validates the path with the dev fake meter. After that
# verification, enable via the staged rollout in
# docs/runbooks/sensor-rollout.md (canary pool → soak → widen) by uncommenting:
#modules:
#  green:
#    enabled: true
#sensor:
#  green:
#    enabled: true    # merge into the sensor block above
#green:
#  gridIntensity: 0   # your provider's factor (gCO2e/kWh), or set region: "FR"
#  pue: 0             # your facility's measured PUE
# NEVER set sensor.green.fakeCpuMeter here — it fabricates measurements and
# exists for RAPL-less CI only.

ingress:
  enabled: true
  className: nginx
  host: avuruops.example.com
  annotations: {}

# Auth is built into the hub (auth.enabled defaults true) — no oauth2-proxy at
# the ingress. Uncomment to add SSO via your OIDC IdP (disabled by default);
# in production always use existingSecret, never the in-values clientSecret:
