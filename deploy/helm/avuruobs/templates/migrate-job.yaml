{{- /* Hub-owned: skipped entirely on a gateway-only (secondary cluster) install. */}}
{{- if .Values.hub.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "avuruobs.fullname" . }}-migrate
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # post-install AND post-upgrade (NOT pre-*): with an in-chart ClickHouse,
    # pre-* hooks run before Helm applies the StatefulSet, so the migrator has
    # nothing to connect to (and a previously-failed release would never recover,
    # since CH still wouldn't exist). post-* hooks run AFTER Helm applies the
    # manifests and `--wait`s them ready, so ClickHouse is always up first. The
    # Job's own ~60s CH retry is a safety net. Migrations are additive and the
    # hub tolerates a not-yet-migrated store, so applying schema just after the
    # app rolls is safe.
    #
    # NOTE: `--wait` failing (any component slow to become Ready) makes Helm
    # skip this hook entirely — the release fails while the Deployments roll out
    # anyway, leaving a healthy-looking install with no schema. That is why the
    # hub also self-heals (hub.autoMigrate); this Job stays the normal path and
    # the loud one, since a failing migration fails the release.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    # NOT hook-succeeded: a Job that deletes itself on success makes "did the
    # migration ever run?" unanswerable from kubectl, which is exactly the
    # question an install with missing tables raises. Keep it for an hour
    # instead — the TTL matters because Helm does not track hook objects in the
    # release manifest, so `helm uninstall` would otherwise leave it behind.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "avuruobs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "avuruobs.image" (dict "registry" .Values.image.registry "repo" .Values.hub.repository "tag" (.Values.hub.tag | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "avuruobs.clickhouseEnv" . | nindent 12 }}
            {{- include "avuruobs.modulesEnv" . | nindent 12 }}
            {{- /* How long to wait for ClickHouse before giving up. A cold
                   cluster restoring a large volume can outlast the default. */}}
            - name: AVURUOBS_MIGRATE_WAIT_SECONDS
              value: {{ .Values.migrate.clickhouseWaitSeconds | quote }}
            {{- include "avuruobs.retentionEnv" . | nindent 12 }}
{{- end }}
