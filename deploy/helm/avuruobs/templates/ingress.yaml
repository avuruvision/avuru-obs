{{- if .Values.ingress.enabled }}
{{- $mainHost := or .Values.hub.enabled .Values.ui.enabled }}
{{- $sentryHost := and (include "avuruobs.sentryEnabled" .) .Values.ingress.sentryHost }}
{{- if not (or $mainHost $sentryHost) }}
{{- fail "ingress.enabled=true but there is nothing to route: this install runs neither the hub nor the UI, and Sentry ingest (which has its own host) is off. An Ingress with no rules is rejected by the API server." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avuruobs.fullname" . }}
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* The main host serves the hub and the UI. A gateway-only install runs
           neither, and a host rule with no paths is rejected outright — so the
           whole rule goes, not just its backends. */}}
    {{- if $mainHost }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Single-origin split: API + health to the hub, everything else to
          # the UI (most-specific paths first).
          {{- if .Values.hub.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-hub
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-hub
                port:
                  number: 80
          {{- end }}
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-ui
                port:
                  number: 80
          {{- end }}
    {{- end }}
    {{- if $sentryHost }}
    # Sentry SDK ingest gets its OWN host: the SDKs POST to
    # /api/<project>/envelope/, which on the main host would be swallowed by the
    # /api -> hub rule above. The project id is part of the path, so no static
    # rule can separate them — a second hostname is the portable way to do it.
    - host: {{ .Values.ingress.sentryHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-gateway
                port:
                  number: 4319
    {{- end }}
{{- end }}
