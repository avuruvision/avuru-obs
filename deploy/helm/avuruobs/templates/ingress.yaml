{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avuruobs.fullname" . }}
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Single-origin split: API + health to the hub, everything else to
          # the UI (most-specific paths first).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-hub
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-hub
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-ui
                port:
                  number: 80
    {{- if and (include "avuruobs.sentryEnabled" .) .Values.ingress.sentryHost }}
    # Sentry SDK ingest gets its OWN host: the SDKs POST to
    # /api/<project>/envelope/, which on the main host would be swallowed by the
    # /api -> hub rule above. The project id is part of the path, so no static
    # rule can separate them — a second hostname is the portable way to do it.
    - host: {{ .Values.ingress.sentryHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "avuruobs.fullname" . }}-gateway
                port:
                  number: 4319
    {{- end }}
{{- end }}
