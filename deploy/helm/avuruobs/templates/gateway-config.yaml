apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruobs.fullname" . }}-gateway
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    {{- /* Sentry events become log records in otel_logs, so the ingest needs
           the logs module (its table) as well as error-tracking + the flag.
           Shared with the container/Service ports and the ingress route. */}}
    {{- $sentry := include "avuruobs.sentryEnabled" . }}
    {{- $jaeger := include "avuruobs.jaegerEnabled" . }}
    {{- $zipkin := include "avuruobs.zipkinEnabled" . }}
    {{- $promRW := include "avuruobs.promRWEnabled" . }}
    {{- $loki := include "avuruobs.lokiEnabled" . }}
    {{- $ingestAuth := include "avuruobs.ingestAuthEnabled" . }}
    {{- $ingestStamp := include "avuruobs.ingestTenantStamp" . }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            {{- if $ingestAuth }}
            auth:
              authenticator: avuruingestauth
            {{- end }}
          http:
            endpoint: 0.0.0.0:4318
            {{- if $ingestAuth }}
            auth:
              authenticator: avuruingestauth
            {{- end }}
    {{- if $jaeger }}
      # Legacy Jaeger senders (gRPC + thrift-HTTP only — UDP has no auth hook).
      # Everything is OTLP by the first processor, so the tenant stage below
      # applies unchanged.
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
            {{- if $ingestAuth }}
            auth:
              authenticator: avuruingestauth
            {{- end }}
          thrift_http:
            endpoint: 0.0.0.0:14268
            {{- if $ingestAuth }}
            auth:
              authenticator: avuruingestauth
            {{- end }}
    {{- end }}
    {{- if $zipkin }}
      zipkin:
        endpoint: 0.0.0.0:9411
        {{- if $ingestAuth }}
        auth:
          authenticator: avuruingestauth
        {{- end }}
    {{- end }}
    {{- if $promRW }}
      # Remote-Write v2 only (v1 gets HTTP 415) — see values.yaml for the
      # sender-side requirements.
      prometheusremotewrite:
        endpoint: 0.0.0.0:9291
        {{- if $ingestAuth }}
        auth:
          authenticator: avuruingestauth
        {{- end }}
    {{- end }}
    {{- if $loki }}
      # Stream labels land as log-record attributes; keep the sender's entry
      # timestamps (migration fidelity) instead of stamping observed time.
      loki:
        protocols:
          http:
            endpoint: 0.0.0.0:3100
            {{- if $ingestAuth }}
            auth:
              authenticator: avuruingestauth
            {{- end }}
        use_incoming_timestamp: true
    {{- end }}
    {{- if $sentry }}
      # Sentry SDK ingest (error-tracking module). Browser SDKs POST
      # cross-origin, so CORS must be open; expose :4319 via ingress to accept
      # them. Events become OTel log records the hub derives issues from.
      sentry:
        endpoint: 0.0.0.0:4319
        cors:
          allowed_origins:
            {{- toYaml .Values.gateway.sentry.allowedOrigins | nindent 12 }}
        {{- with .Values.gateway.sentry.projects }}
        projects:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
    processors:
    {{- if $ingestStamp }}
      # Stamps avuru.tenant from the ingest key's validated project (enforce
      # only — in log mode the extension attaches no project, so this would be a
      # no-op hop on every record).
      tenantfromauth: {}
    {{- end }}
    {{- if .Values.gateway.tenantByNamespace }}
      # Per-namespace project mapping: stamps avuru.tenant from the sender's
      # k8s.namespace.name resource attribute (set by the sensor), so ONE
      # shared-cluster install splits environments into projects. Runs before
      # resource/tenant, which becomes the fallback for unmatched telemetry
      # (node metrics, SDKs without k8s attributes).
      transform/tenant:
        error_mode: ignore
      {{- $stmts := list }}
      {{- range $ns, $tenant := .Values.gateway.tenantByNamespace }}
      {{- $stmts = append $stmts (printf "set(attributes[\"avuru.tenant\"], %q) where attributes[\"k8s.namespace.name\"] == %q" $tenant $ns) }}
      {{- end }}
        trace_statements:
          - context: resource
            statements:
            {{- range $stmts }}
              - {{ . | quote }}
            {{- end }}
        log_statements:
          - context: resource
            statements:
            {{- range $stmts }}
              - {{ . | quote }}
            {{- end }}
        metric_statements:
          - context: resource
            statements:
            {{- range $stmts }}
              - {{ . | quote }}
            {{- end }}
    {{- end }}
    {{- if .Values.gateway.tenant }}
      # Everything through this gateway belongs to one project/environment
      # (one project per cluster). `upsert` makes the gateway the
      # authority; senders stay untouched (drop-in OTLP). Use action `insert`
      # instead if trusted senders must pick their own tenant. When
      # tenantByNamespace is set this becomes `insert` automatically so the
      # per-namespace stamp above is never clobbered.
      resource/tenant:
        attributes:
          - key: avuru.tenant
            value: {{ .Values.gateway.tenant | quote }}
            action: {{ if .Values.gateway.tenantByNamespace }}insert{{ else }}upsert{{ end }}
    {{- end }}
      batch:
        send_batch_size: 4096
        timeout: 2s
    {{- $fwdOTLP := .Values.gateway.forward.otlp }}
    {{- $fwdKafka := .Values.gateway.forward.kafka }}
    {{- if and $fwdOTLP.enabled (not $fwdOTLP.endpoint) }}
    {{- fail "gateway.forward.otlp.enabled requires gateway.forward.otlp.endpoint" }}
    {{- end }}
    {{- if and $fwdOTLP.enabled (not (has $fwdOTLP.protocol (list "grpc" "http"))) }}
    {{- fail "gateway.forward.otlp.protocol must be grpc or http" }}
    {{- end }}
    {{- if and $fwdKafka.enabled (not $fwdKafka.brokers) }}
    {{- fail "gateway.forward.kafka.enabled requires gateway.forward.kafka.brokers" }}
    {{- end }}
    {{- if and $fwdKafka.enabled $fwdKafka.sasl.enabled (not $fwdKafka.sasl.existingSecret) }}
    {{- fail "gateway.forward.kafka.sasl.enabled requires sasl.existingSecret (inline credentials would land in the ConfigMap)" }}
    {{- end }}
    {{- /* The otlp and otlphttp exporters are distinct components, so the
           forward exporter's NAME follows the protocol. */}}
    {{- $fwdName := "otlp/forward" }}
    {{- if eq $fwdOTLP.protocol "http" }}{{ $fwdName = "otlphttp/forward" }}{{ end }}
    exporters:
      clickhouse:
        endpoint: tcp://{{ include "avuruobs.clickhouseAddr" . }}
        username: {{ include "avuruobs.clickhouseUser" . }}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: {{ include "avuruobs.clickhouseDatabase" . }}
        # Schema is owned by `hub migrate`; the exporter never creates tables.
        create_schema: false
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 2s
          max_elapsed_time: 60s
    {{- if $fwdOTLP.enabled }}
      # Dual-write target. The sending queue + bounded retry are load-bearing:
      # without them a dead target stalls the shared pipeline and takes the
      # ClickHouse write path down with it. Forwarding is best-effort.
      {{ $fwdName }}:
        endpoint: {{ $fwdOTLP.endpoint | quote }}
        {{- if $fwdOTLP.insecure }}
        tls:
          insecure: true
        {{- end }}
        {{- with $fwdOTLP.headers }}
        headers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 60s
    {{- end }}
    {{- if $fwdKafka.enabled }}
      kafka/forward:
        brokers:
          {{- toYaml $fwdKafka.brokers | nindent 10 }}
        {{- if $fwdKafka.tls.enabled }}
        tls:
          insecure_skip_verify: {{ $fwdKafka.tls.insecureSkipVerify }}
        {{- end }}
        {{- if $fwdKafka.sasl.enabled }}
        auth:
          sasl:
            mechanism: {{ $fwdKafka.sasl.mechanism | quote }}
            username: ${env:AVURUOBS_FORWARD_KAFKA_SASL_USERNAME}
            password: ${env:AVURUOBS_FORWARD_KAFKA_SASL_PASSWORD}
        {{- end }}
        {{- range $signal := list "traces" "logs" "metrics" }}
        {{- if has $signal $fwdKafka.signals }}
        {{ $signal }}:
          topic: {{ index $fwdKafka.topics $signal | quote }}
          encoding: {{ $fwdKafka.encoding | quote }}
        {{- end }}
        {{- end }}
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 60s
    {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    {{- if $ingestAuth }}
      # Per-project ingest keys. The hub answers a control-plane validation call
      # only — it is never in the telemetry byte-path. staleGrace keeps cached
      # verdicts serving through a hub blip so a control-plane outage cannot
      # drop traffic.
      avuruingestauth:
        hub_validate_url: http://{{ include "avuruobs.fullname" . }}-hub:80/internal/v1/ingest-keys/validate
        internal_token: ${env:AVURUOBS_INGEST_INTERNAL_TOKEN}
        mode: {{ .Values.auth.ingest.mode | quote }}
        cache_ttl: {{ .Values.auth.ingest.cacheTTL | quote }}
        stale_grace: {{ .Values.auth.ingest.staleGrace | quote }}
    {{- end }}
    service:
      extensions: [health_check{{ if $ingestAuth }}, avuruingestauth{{ end }}]
      pipelines:
    {{- $tenantStage := "" }}
    {{- if .Values.gateway.tenantByNamespace }}{{ $tenantStage = "transform/tenant, " }}{{ end }}
    {{- if .Values.gateway.tenant }}{{ $tenantStage = printf "%sresource/tenant, " $tenantStage }}{{ end }}
    {{- /* tenantfromauth runs LAST in the tenant stage, not first: resource/tenant
           upserts the static gateway.tenant, so stamping the key's project before
           it would let the static value silently win and defeat enforce mode's
           whole point. Running last makes the validated key the final authority.
           Absent entirely outside enforce, so log/off pipelines are unchanged. */}}
    {{- if $ingestStamp }}{{ $tenantStage = printf "%stenantfromauth, " $tenantStage }}{{ end }}
    {{- /* A module's pipeline is dropped when the module is off: its tables
           don't exist, so accepting the signal would only produce export
           errors. `traces` is core and always present, so the collector
           always has at least one pipeline. */}}
    {{- /* Forward exporters join a pipeline only when its signal is selected —
           an off-module signal is skipped silently (the pipeline itself is
           absent), which is what "intersected with active pipelines" means. */}}
    {{- $fwdT := "" }}{{ if and $fwdOTLP.enabled (has "traces" $fwdOTLP.signals) }}{{ $fwdT = printf ", %s" $fwdName }}{{ end }}{{ if and $fwdKafka.enabled (has "traces" $fwdKafka.signals) }}{{ $fwdT = printf "%s, kafka/forward" $fwdT }}{{ end }}
    {{- $fwdL := "" }}{{ if and $fwdOTLP.enabled (has "logs" $fwdOTLP.signals) }}{{ $fwdL = printf ", %s" $fwdName }}{{ end }}{{ if and $fwdKafka.enabled (has "logs" $fwdKafka.signals) }}{{ $fwdL = printf "%s, kafka/forward" $fwdL }}{{ end }}
    {{- $fwdM := "" }}{{ if and $fwdOTLP.enabled (has "metrics" $fwdOTLP.signals) }}{{ $fwdM = printf ", %s" $fwdName }}{{ end }}{{ if and $fwdKafka.enabled (has "metrics" $fwdKafka.signals) }}{{ $fwdM = printf "%s, kafka/forward" $fwdM }}{{ end }}
        traces:
          receivers: [otlp{{ if $jaeger }}, jaeger{{ end }}{{ if $zipkin }}, zipkin{{ end }}]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse{{ $fwdT }}]
    {{- if or .Values.modules.logs.enabled $sentry }}
        logs:
          receivers: [otlp{{ if $sentry }}, sentry{{ end }}{{ if $loki }}, loki{{ end }}]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse{{ $fwdL }}]
    {{- end }}
    {{- if .Values.modules.infraMetrics.enabled }}
        metrics:
          receivers: [otlp{{ if $promRW }}, prometheusremotewrite{{ end }}]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse{{ $fwdM }}]
    {{- end }}
