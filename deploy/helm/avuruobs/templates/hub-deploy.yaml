apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avuruobs.fullname" . }}-hub
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      {{- include "avuruobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "avuruobs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      {{- if .Values.collection.runtimeControl.enabled }}
      {{- /* Only the runtime-collection opt-in gives the hub pod an identity:
             the default install stays on the namespace's default SA with no
             API rights at all (see collection-rbac.yaml). */}}
      serviceAccountName: {{ include "avuruobs.fullname" . }}-collection-control
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ include "avuruobs.image" (dict "registry" .Values.image.registry "repo" .Values.hub.repository "tag" (.Values.hub.tag | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "avuruobs.clickhouseEnv" . | nindent 12 }}
            {{- include "avuruobs.modulesEnv" . | nindent 12 }}
            {{- include "avuruobs.groupsEnv" . | nindent 12 }}
            {{- include "avuruobs.alertsEnv" . | nindent 12 }}
            {{- /* with-guard on the OUTPUT, not a restated module condition:
                   an empty include piped through nindent would leave a stray
                   indented blank line in default renders. */}}
            {{- with include "avuruobs.greenEnv" . }}{{ . | nindent 12 }}{{- end }}
            {{- if .Values.projects }}
            - name: AVURUOBS_PROJECTS
              value: {{ join "," .Values.projects | quote }}
            {{- end }}
            {{- if include "avuruobs.ingestAuthEnabled" . }}
            {{- /* Registers POST /internal/v1/ingest-keys/validate (the hub
                   skips the route entirely when this is empty) and seeds the
                   chart-provisioned sensor key so enforce mode has something
                   valid to accept before anyone flips the dial. */}}
            - name: AVURUOBS_INGEST_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "avuruobs.ingestSecretName" . }}
                  key: internal-token
            {{- if .Values.auth.ingest.provisionSensorKey }}
            - name: AVURUOBS_INGEST_SEED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "avuruobs.ingestSecretName" . }}
                  key: seed-keys
            {{- end }}
            {{- end }}
            - name: AVURUOBS_AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            {{- /* Always emitted (like AVURUOBS_AUTH_ENABLED above), and
                   deliberately OUTSIDE the auth.enabled block that opens
                   below — the collection routes are gated on this flag alone. */}}
            - name: AVURUOBS_COLLECTION_RUNTIME_CONTROL_ENABLED
              value: {{ .Values.collection.runtimeControl.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: AVURUOBS_AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "avuruobs.fullname" .)) }}
                  key: admin-password
            - name: AVURUOBS_AUTH_SESSION_TTL_HOURS
              value: {{ .Values.auth.sessionTTLHours | quote }}
            {{- if .Values.auth.anonymous.role }}
            - name: AVURUOBS_AUTH_ANONYMOUS_ROLE
              value: {{ .Values.auth.anonymous.role | quote }}
            - name: AVURUOBS_AUTH_ANONYMOUS_PROJECTS
              value: {{ join "," .Values.auth.anonymous.projects | quote }}
            {{- end }}
            {{- if .Values.auth.demo.enabled }}
            - name: AVURUOBS_DEMO_ENABLED
              value: "true"
            - name: AVURUOBS_DEMO_EMAIL
              value: {{ .Values.auth.demo.email | quote }}
            - name: AVURUOBS_DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "avuruobs.fullname" .)) }}
                  key: demo-password
            {{- end }}
            {{- with include "avuruobs.oidcEnv" . }}{{ . | nindent 12 }}{{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- if or .Values.modules.serviceHealth.enabled .Values.modules.alerting.enabled .Values.modules.green.enabled (include "avuruobs.oidcEnabled" .) }}
          volumeMounts:
            {{- include "avuruobs.groupsVolumeMount" . | nindent 12 }}
            {{- include "avuruobs.alertsVolumeMount" . | nindent 12 }}
            {{- with include "avuruobs.greenVolumeMount" . }}{{ . | nindent 12 }}{{- end }}
            {{- with include "avuruobs.oidcVolumeMount" . }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
      {{- if or .Values.modules.serviceHealth.enabled .Values.modules.alerting.enabled .Values.modules.green.enabled (include "avuruobs.oidcEnabled" .) }}
      volumes:
        {{- include "avuruobs.groupsVolume" . | nindent 8 }}
        {{- include "avuruobs.alertsVolume" . | nindent 8 }}
        {{- with include "avuruobs.greenVolume" . }}{{ . | nindent 8 }}{{- end }}
        {{- with include "avuruobs.oidcVolume" . }}{{ . | nindent 8 }}{{- end }}
      {{- end }}
