{{- /* UI-owned: the chart refuses ui.enabled without hub.enabled (component-toggles.yaml). */}}
{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avuruobs.fullname" . }}-ui
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "avuruobs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
