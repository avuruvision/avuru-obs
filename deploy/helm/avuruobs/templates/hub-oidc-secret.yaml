{{- /* Hub-owned config: not rendered on a gateway-only install. */}}
{{- if and .Values.hub.enabled (include "avuruobs.oidcEnabled" .) .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avuruobs.fullname" . }}-oidc
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
type: Opaque
data:
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | b64enc | quote }}
{{- end }}
