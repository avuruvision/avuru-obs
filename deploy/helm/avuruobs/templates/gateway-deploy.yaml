apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avuruobs.fullname" . }}-gateway
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "avuruobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "avuruobs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "avuruobs.image" (dict "registry" .Values.image.registry "repo" .Values.gateway.image.repository "tag" (.Values.gateway.image.tag | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/avuru/config.yaml"]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "avuruobs.clickhouseSecretName" . }}
                  key: clickhouse-password
            {{- if include "avuruobs.ingestAuthEnabled" . }}
            {{- /* Referenced as ${env:...} by the avuruingestauth extension, so
                   the shared secret never lands in the gateway ConfigMap. */}}
            - name: AVURUOBS_INGEST_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "avuruobs.ingestSecretName" . }}
                  key: internal-token
            {{- end }}
            {{- if and .Values.gateway.forward.kafka.enabled .Values.gateway.forward.kafka.sasl.enabled }}
            {{- /* Same ${env:...} indirection: SASL credentials come from the
                   operator's Secret, never the gateway ConfigMap. */}}
            - name: AVURUOBS_FORWARD_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.forward.kafka.sasl.existingSecret }}
                  key: sasl-username
            - name: AVURUOBS_FORWARD_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.forward.kafka.sasl.existingSecret }}
                  key: sasl-password
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/avuru
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- if include "avuruobs.sentryEnabled" . }}
            - name: sentry-http
              containerPort: 4319
            {{- end }}
            {{- if include "avuruobs.jaegerEnabled" . }}
            - name: jaeger-grpc
              containerPort: 14250
            - name: jaeger-thrift
              containerPort: 14268
            {{- end }}
            {{- if include "avuruobs.zipkinEnabled" . }}
            - name: zipkin
              containerPort: 9411
            {{- end }}
            {{- if include "avuruobs.promRWEnabled" . }}
            - name: prom-rw
              containerPort: 9291
            {{- end }}
            {{- if include "avuruobs.lokiEnabled" . }}
            - name: loki-push
              containerPort: 3100
            {{- end }}
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "avuruobs.fullname" . }}-gateway
