{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avuruobs.fullname" . }}-auth
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" (include "avuruobs.fullname" .))) }}
  {{- if .Values.auth.adminPassword }}
  admin-password: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if and $existing $existing.data }}
  admin-password: {{ index $existing.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.demo.enabled }}
  {{- if .Values.auth.demo.password }}
  demo-password: {{ .Values.auth.demo.password | b64enc | quote }}
  {{- /*
  dig, not `and $existing $existing.data (index $existing.data ...)`: see
  ingest-secret.yaml — Go's `and` only short-circuits since Go 1.18, so an
  older Helm build still runs the index call against a nil $existing.data
  and crashes lint/template instead of falling through.
  */ -}}
  {{- else if dig "data" "demo-password" "" $existing }}
  demo-password: {{ dig "data" "demo-password" "" $existing | quote }}
  {{- else }}
  demo-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
