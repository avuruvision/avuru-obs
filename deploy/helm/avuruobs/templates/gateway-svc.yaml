{{- /* Ingest path: off for a query-only instance that receives telemetry from elsewhere. */}}
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avuruobs.fullname" . }}-gateway
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "avuruobs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    # The ONLY address instrumented apps point at (Jaeger drop-in).
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    {{- if include "avuruobs.sentryEnabled" . }}
    # Sentry SDK ingest. Reachable in-cluster on 4319; expose it from outside
    # via ingress.sentryHost (browser SDKs are cross-origin).
    - name: sentry-http
      port: 4319
      targetPort: sentry-http
    {{- end }}
    {{- /* Wider-ingest receivers: in-cluster ports only; external exposure is
           an ingress recipe (Zipkin's /api/v2/spans and remote-write's
           /api/v1/write collide with the main host's /api → hub rule). */}}
    {{- if include "avuruobs.jaegerEnabled" . }}
    - name: jaeger-grpc
      port: 14250
      targetPort: jaeger-grpc
    - name: jaeger-thrift
      port: 14268
      targetPort: jaeger-thrift
    {{- end }}
    {{- if include "avuruobs.zipkinEnabled" . }}
    - name: zipkin
      port: 9411
      targetPort: zipkin
    {{- end }}
    {{- if include "avuruobs.promRWEnabled" . }}
    - name: prom-rw
      port: 9291
      targetPort: prom-rw
    {{- end }}
    {{- if include "avuruobs.lokiEnabled" . }}
    - name: loki-push
      port: 3100
      targetPort: loki-push
    {{- end }}
{{- end }}
