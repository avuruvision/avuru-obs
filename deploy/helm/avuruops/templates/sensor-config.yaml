{{- if and .Values.sensor.enabled .Values.sensor.obi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruops.fullname" . }}-sensor-obi
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  obi-config.yml: |
    # Zero-code instrumentation scoped by sensor.collection / sensor.obi
    # .discovery values. The release's own namespace is ALWAYS excluded (the
    # platform must not trace itself); kube-system & co are excluded via
    # sensor.collection.excludeNamespaces rather than trusting OBI's
    # built-in defaults.
    discovery:
      instrument:
        {{- range .Values.sensor.obi.discovery.namespaces }}
        - k8s_namespace: {{ . | quote }}
        {{- end }}
      exclude_instrument:
        - k8s_namespace: {{ .Release.Namespace | quote }}
        {{- range concat .Values.sensor.collection.excludeNamespaces .Values.sensor.obi.discovery.excludeNamespaces }}
        - k8s_namespace: {{ . | quote }}
        {{- end }}
        {{- if .Values.sensor.collection.optOutLabel }}
        # Per-pod escape hatch for probe-sensitive workloads.
        - k8s_pod_labels:
            {{ .Values.sensor.collection.optOutLabel | quote }}: "false"
        {{- end }}
    attributes:
      kubernetes:
        enable: true
    routes:
      # heuristic keeps http.route cardinality bounded (ids -> wildcards);
      # explicit because RED metric cardinality is a product concern.
      unmatched: heuristic
{{- end }}
{{- /* The agent needs >=1 active pipeline or the collector crash-loops. */}}
{{- $agentActive := and .Values.sensor.enabled .Values.sensor.agent.enabled (or .Values.sensor.agent.logs.enabled .Values.sensor.agent.kubeletstats.enabled) }}
{{- if $agentActive }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruops.fullname" . }}-sensor-agent
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  config.yaml: |
    receivers:
    {{- if .Values.sensor.agent.logs.enabled }}
      filelog:
        # Zero-config stdout/stderr collection for every pod on the node,
        # EXCEPT this release's namespace (the platform must not ingest its
        # own logs: gateway error -> agent ships it -> gateway error ...) and
        # the shared sensor.collection.excludeNamespaces list.
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/{{ .Release.Namespace }}_*/*/*.log
        {{- range .Values.sensor.collection.excludeNamespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
        {{- end }}
        start_at: beginning
        storage: file_storage
        operators:
          # Parses containerd/cri-o/docker formats and promotes k8s.pod.name,
          # k8s.namespace.name, k8s.container.name, k8s.pod.uid from the file
          # path to resource attributes.
          - type: container
    {{- end }}
    {{- if .Values.sensor.agent.kubeletstats.enabled }}
      # Node/pod CPU, memory, network from this node's kubelet (Supporting
      # signal tier). Read-only stats API via the pod ServiceAccount.
      kubeletstats:
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        # kubelet serving certs are typically self-signed per node
        insecure_skip_verify: true
        collection_interval: {{ .Values.sensor.agent.kubeletstats.interval }}
        metric_groups: [node, pod]
    {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
          {{- if .Values.sensor.collection.optOutLabel }}
          labels:
            # Surfaces the per-pod opt-out label so filter/collection can
            # drop that pod's logs and metrics (same label OBI honors).
            - tag_name: avuru.obs.collect
              key: {{ .Values.sensor.collection.optOutLabel }}
              from: pod
          {{- end }}
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      {{- if or .Values.sensor.collection.excludeNamespaces .Values.sensor.collection.optOutLabel }}
      # Collection guardrails: drop pod-scoped telemetry from excluded
      # namespaces and opted-out pods. Node-level metrics carry no
      # k8s.namespace.name attribute and are never dropped here.
      filter/collection:
        error_mode: ignore
        metrics:
          datapoint:
          {{- range .Values.sensor.collection.excludeNamespaces }}
            - resource.attributes["k8s.namespace.name"] == {{ . | quote }}
          {{- end }}
          {{- if .Values.sensor.collection.optOutLabel }}
            - resource.attributes["avuru.obs.collect"] == "false"
          {{- end }}
        logs:
          log_record:
          {{- range .Values.sensor.collection.excludeNamespaces }}
            - resource.attributes["k8s.namespace.name"] == {{ . | quote }}
          {{- end }}
          {{- if .Values.sensor.collection.optOutLabel }}
            - resource.attributes["avuru.obs.collect"] == "false"
          {{- end }}
      {{- end }}
      # Tailed logs carry no OTLP resource, so service.name is empty and the
      # Logs UI would show blank services — derive it from workload metadata.
      transform/service_name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
      batch:
        send_batch_size: 2048
        timeout: 2s
    exporters:
      otlphttp:
        endpoint: http://{{ include "avuruops.fullname" . }}-gateway:4318
    extensions:
      health_check:
        endpoint: 0.0.0.0:13134
      # filelog offset checkpoints survive agent restarts (no re-ingestion).
      file_storage:
        directory: /var/lib/otel-agent
    service:
      extensions: [health_check, file_storage]
      pipelines:
    {{- $collectionFilter := or .Values.sensor.collection.excludeNamespaces .Values.sensor.collection.optOutLabel }}
    {{- if .Values.sensor.agent.logs.enabled }}
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes{{ if $collectionFilter }}, filter/collection{{ end }}, transform/service_name, batch]
          exporters: [otlphttp]
    {{- end }}
    {{- if .Values.sensor.agent.kubeletstats.enabled }}
        metrics:
          # k8sattributes adds workload names (deployment/statefulset) to pod
          # metrics via k8s.pod.uid, for the pods panel.
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes{{ if $collectionFilter }}, filter/collection{{ end }}, batch]
          exporters: [otlphttp]
    {{- end }}
{{- end }}
{{- if and .Values.sensor.enabled .Values.sensor.profiler.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruops.fullname" . }}-sensor-profiler
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  config.yaml: |
    receivers:
      profiling:
        samples_per_second: {{ .Values.sensor.profiler.samplesPerSecond }}
    processors:
      # NO batch here: the batch processor does not support the profiles
      # signal in this collector line ("telemetry type is not supported" at
      # startup); the profiling receiver already reports in batches.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
      # Straight to the hub's profiles-ingest seam (OTLP/HTTP appends the
      # /v1development/profiles path) — documented profiles-only exception to
      # "the hub is never in the telemetry byte-path".
      otlphttp:
        endpoint: http://{{ include "avuruops.fullname" . }}-hub:80
    extensions:
      health_check:
        endpoint: 0.0.0.0:13135
    service:
      extensions: [health_check]
      # The otel-agent collector in the SAME pod already binds the default
      # internal-telemetry port (127.0.0.1:8888); a second listener crashes.
      # v0.1 doesn't scrape collector self-metrics — disable them here.
      telemetry:
        metrics:
          level: none
      pipelines:
        profiles:
          receivers: [profiling]
          processors: [memory_limiter]
          exporters: [otlphttp]
{{- end }}
