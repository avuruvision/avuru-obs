{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avuruops.fullname" . }}-auth
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" (include "avuruops.fullname" .))) }}
  {{- if .Values.auth.adminPassword }}
  admin-password: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if and $existing $existing.data }}
  admin-password: {{ index $existing.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
