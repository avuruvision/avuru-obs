{{- /*
Ingest-key material. Kept in its own Secret rather than the auth Secret because
ingest authentication is independent of UI authentication: an operator can
enforce keys at the gateway with auth.enabled=false, or run OIDC with
auth.ingest.mode=off.

Everything here is generated once and REUSED on upgrade via lookup — regenerating
the internal token would break gateway→hub validation mid-flight, and
regenerating the sensor key would silence the sensor until the hub re-seeded.
The sensor key is minted here (not by the hub) because the chart is the only
place that can hand the same raw value to both the sensor's exporter and the
hub's seeder — the hub only ever stores its hash.
*/ -}}
{{- if ne .Values.auth.ingest.mode "off" }}
{{- $name := include "avuruops.ingestSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $token := .Values.auth.ingest.internalToken }}
{{- if not $token }}
  {{- /*
  dig, not `and $existing $existing.data (index $existing.data ...)`: Go's
  `and` only short-circuits its arguments since Go 1.18, so on a Helm build
  compiled with an older Go toolchain the index call still runs even when
  $existing.data is nil (lookup returns an empty, not nil, map when there's
  no cluster access — always true for lint/template), crashing with "index
  of untyped nil". dig defaults instead of indexing through a missing level.
  */ -}}
  {{- $existingToken := dig "data" "internal-token" "" $existing }}
  {{- if $existingToken }}
    {{- $token = $existingToken | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 40 }}
  {{- end }}
{{- end }}
{{- $sensorKey := "" }}
{{- if .Values.auth.ingest.provisionSensorKey }}
  {{- $existingSensorKey := dig "data" "sensor-key" "" $existing }}
  {{- if $existingSensorKey }}
    {{- $sensorKey = $existingSensorKey | b64dec }}
  {{- else }}
    {{- $sensorKey = printf "avuruk_%s" (randAlphaNum 32) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
type: Opaque
data:
  # Shared by the hub (AVURUOPS_INGEST_INTERNAL_TOKEN) and the gateway
  # extension; guards POST /internal/v1/ingest-keys/validate.
  internal-token: {{ $token | b64enc | quote }}
  {{- if $sensorKey }}
  # Raw key for the sensor's OTLP exporter header.
  sensor-key: {{ $sensorKey | b64enc | quote }}
  # The same key as a hub seed record, so the hash exists in auth_ingest_key
  # before anyone flips mode to enforce.
  seed-keys: {{ list (dict "project" (include "avuruops.ingestSensorProject" .) "name" "sensor" "key" $sensorKey) | toJson | b64enc | quote }}
  {{- end }}
{{- end }}
