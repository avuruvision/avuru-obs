apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avuruops.fullname" . }}-hub
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      {{- include "avuruops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "avuruops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ include "avuruops.image" (dict "registry" .Values.image.registry "repo" .Values.hub.repository "tag" (.Values.hub.tag | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "avuruops.clickhouseEnv" . | nindent 12 }}
            {{- include "avuruops.modulesEnv" . | nindent 12 }}
            {{- include "avuruops.groupsEnv" . | nindent 12 }}
            {{- include "avuruops.alertsEnv" . | nindent 12 }}
            {{- /* with-guard on the OUTPUT, not a restated module condition:
                   an empty include piped through nindent would leave a stray
                   indented blank line in default renders. */}}
            {{- with include "avuruops.greenEnv" . }}{{ . | nindent 12 }}{{- end }}
            {{- if .Values.projects }}
            - name: AVURUOPS_PROJECTS
              value: {{ join "," .Values.projects | quote }}
            {{- end }}
            - name: AVURUOPS_AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: AVURUOPS_AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "avuruops.fullname" .)) }}
                  key: admin-password
            - name: AVURUOPS_AUTH_SESSION_TTL_HOURS
              value: {{ .Values.auth.sessionTTLHours | quote }}
            {{- if .Values.auth.anonymous.role }}
            - name: AVURUOPS_AUTH_ANONYMOUS_ROLE
              value: {{ .Values.auth.anonymous.role | quote }}
            - name: AVURUOPS_AUTH_ANONYMOUS_PROJECTS
              value: {{ join "," .Values.auth.anonymous.projects | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- if or .Values.modules.serviceHealth.enabled .Values.modules.alerting.enabled .Values.modules.green.enabled }}
          volumeMounts:
            {{- include "avuruops.groupsVolumeMount" . | nindent 12 }}
            {{- include "avuruops.alertsVolumeMount" . | nindent 12 }}
            {{- with include "avuruops.greenVolumeMount" . }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
      {{- if or .Values.modules.serviceHealth.enabled .Values.modules.alerting.enabled .Values.modules.green.enabled }}
      volumes:
        {{- include "avuruops.groupsVolume" . | nindent 8 }}
        {{- include "avuruops.alertsVolume" . | nindent 8 }}
        {{- with include "avuruops.greenVolume" . }}{{ . | nindent 8 }}{{- end }}
      {{- end }}
