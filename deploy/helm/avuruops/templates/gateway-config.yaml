apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruops.fullname" . }}-gateway
  labels:
    {{- include "avuruops.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
    {{- if .Values.gateway.tenant }}
      # Everything through this gateway belongs to one project/environment
      # (Coroot-style project-per-cluster). `upsert` makes the gateway the
      # authority; senders stay untouched (drop-in OTLP). Use action `insert`
      # instead if trusted senders must pick their own tenant.
      resource/tenant:
        attributes:
          - key: avuru.tenant
            value: {{ .Values.gateway.tenant | quote }}
            action: upsert
    {{- end }}
      batch:
        send_batch_size: 4096
        timeout: 2s
    exporters:
      clickhouse:
        endpoint: tcp://{{ include "avuruops.clickhouseAddr" . }}
        username: {{ include "avuruops.clickhouseUser" . }}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: {{ include "avuruops.clickhouseDatabase" . }}
        # Schema is owned by `hub migrate`; the exporter never creates tables.
        create_schema: false
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 2s
          max_elapsed_time: 60s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
    {{- $tenantStage := "" }}
    {{- if .Values.gateway.tenant }}{{ $tenantStage = "resource/tenant, " }}{{ end }}
        traces:
          receivers: [otlp]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse]
        logs:
          receivers: [otlp]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [{{ $tenantStage }}batch]
          exporters: [clickhouse]
