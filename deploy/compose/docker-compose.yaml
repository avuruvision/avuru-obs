# Avuru Obs sandbox: ClickHouse + gateway collector + hub + HotROD demo.
# Run from repo root: `make dev` (or `docker compose -f deploy/compose/docker-compose.yaml up`).
name: avuru-obs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: avuru
      CLICKHOUSE_PASSWORD: avuru
      CLICKHOUSE_DB: otel
    volumes:
      # Schema is applied by the `migrate` service (hub migrate), not initdb.d —
      # the single migration mechanism shared with k8s (Helm hook).
      - ./clickhouse/config.d/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123" # HTTP (queries, debugging)
      - "127.0.0.1:9000:9000" # native (hub, exporter)
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # One-shot schema migrator (mirrors the k8s Helm pre-install/pre-upgrade
  # hook). gateway + hub wait for it to complete before starting.
  migrate:
    image: avuru-obs-hub:local
    build:
      context: ../..
      dockerfile: hub/Dockerfile
    command: ["migrate"]
    environment:
      AVURUOBS_CLICKHOUSE_ADDR: clickhouse:9000
      AVURUOBS_CLICKHOUSE_USER: avuru
      AVURUOBS_CLICKHOUSE_PASSWORD: avuru
      # Modules this sandbox runs (empty/unset = all). Drop an entry to skip
      # its schema — the hub then 404s its API and the UI hides its entry.
      # alerting owns 0008_alerts.sql, so it must be listed for the tables.
      AVURUOBS_MODULES: "core,logs,infra-metrics,profiling,error-tracking,alerting,mcp"
      # mcp is listed because it OWNS SCHEMA as of 0022_oauth.sql. It owned
      # none before, so it could be left out of this list while its API still
      # worked; now leaving it out means the OAuth tables are never created.
      # The Helm migrate Job derives its list from the enabled modules and is
      # correct automatically — only hardcoded lists like this one need it.
      AVURUOBS_RETENTION_TRACES_DAYS: "7"
      AVURUOBS_RETENTION_LOGS_DAYS: "3"
      AVURUOBS_RETENTION_METRICS_DAYS: "7"
      AVURUOBS_RETENTION_PROFILES_DAYS: "3"
      AVURUOBS_RETENTION_ERRORS_DAYS: "30"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  gateway:
    # The Avuru minimal OCB distro (not stock contrib): it carries the custom
    # sentryreceiver, which the sandbox enables so browser/SDK error ingest can
    # be exercised end to end.
    image: avuru-obs-gateway:local
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    command: ["--config=/etc/avuru/config.yaml"]
    volumes:
      - ./gateway/config.yaml:/etc/avuru/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — the ONLY address apps need to change (Jaeger drop-in)
      - "4318:4318"   # OTLP HTTP
      - "4319:4319"   # Sentry ingest (error-tracking module)
      - "127.0.0.1:13133:13133" # health_check extension
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No container healthcheck: the contrib image is distroless (no shell).

  hub:
    image: avuru-obs-hub:local
    build:
      context: ../..
      dockerfile: hub/Dockerfile
    environment:
      AVURUOBS_CLICKHOUSE_ADDR: clickhouse:9000
      AVURUOBS_CLICKHOUSE_USER: avuru
      AVURUOBS_CLICKHOUSE_PASSWORD: avuru
      # Deterministic switcher list for e2e (staging fixtures are seeded
      # under the `staging` tenant; discovery would also find it from data).
      AVURUOBS_PROJECTS: default,staging
      # Service-health grouping config: seed volumes are tiny, so minSampleCount
      # is 1 here (the built-in default of 5 would read the fixtures as idle).
      AVURUOBS_GROUPS_CONFIG: /etc/avuruobs/groups.json
      # Alerting rules: fire immediately on the seeded down service so the e2e
      # can assert. Delivery targets an unroutable URL (the loop persists state
      # regardless; delivery is unit-tested, incl. the SSRF guard).
      AVURUOBS_ALERTS_CONFIG: /etc/avuruobs-alerts/alerts.json
      # AVURUOBS_AUTH_* pass-through for local dev/smoke-testing (Task 9 adds
      # the fuller anonymous/OIDC compose wiring). Unset/empty keeps today's
      # behavior: auth stays enabled, and the admin password is generated and
      # logged once at first boot.
      AVURUOBS_AUTH_ADMIN_PASSWORD: ${AVURUOBS_AUTH_ADMIN_PASSWORD:-}
      # OAuth 2.1 for MCP clients. On in the sandbox so the flow is exercised
      # end to end (e2e/oauth_test.go); OFF by default in the chart, where
      # turning it on opens an unauthenticated registration endpoint.
      #
      # The public URL is this hub's own published address, because the
      # authorization server has to advertise absolute URLs a client can fetch
      # — the same reason the chart refuses to render without one.
      AVURUOBS_PUBLIC_URL: http://localhost:18080
      AVURUOBS_MCP_OAUTH_ENABLED: "true"
      # Green energy/carbon config: explicit factors (deterministic gCO2e for
      # e2e) + a budget over the seeded `payments` group, delivered via the
      # `sink` alerting channel. green is auto-active here (the hub sets no
      # AVURUOBS_MODULES, so all modules run) and owns no schema — it reads the
      # otel_metrics_* tables seeded by metrics_kepler.json /
      # metrics_kubeletstats_pods.json.
      AVURUOBS_GREEN_CONFIG: /etc/avuruobs-green/green.json
      # AI token prices. Deliberately PARTIAL: gpt-4o is priced and answers as
      # gpt-4o-2024-08-06, so the sandbox exercises prefix matching; claude-
      # sonnet is priced by nothing, so it exercises the unpriced row and the
      # "this total is a floor" line beside it.
      AVURUOBS_AI_CONFIG: /etc/avuruobs-ai/ai.json
      # The same numbers the migrate service turns into table TTLs. The hub
      # reports them (Settings → Storage: configured vs enforced) and bounds a
      # per-project retention window with them, so the two must not drift.
      AVURUOBS_RETENTION_TRACES_DAYS: "7"
      AVURUOBS_RETENTION_LOGS_DAYS: "3"
      AVURUOBS_RETENTION_METRICS_DAYS: "7"
      AVURUOBS_RETENTION_PROFILES_DAYS: "3"
      AVURUOBS_RETENTION_ERRORS_DAYS: "30"
    volumes:
      - ./groups.json:/etc/avuruobs/groups.json:ro
      - ./alerts.json:/etc/avuruobs-alerts/alerts.json:ro
      - ./green.json:/etc/avuruobs-green/green.json:ro
      - ./ai.json:/etc/avuruobs-ai/ai.json:ro
    ports:
      - "18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/hub", "-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 12

  # Static UI (own nginx pod, separate deployable). Single-origin: serves the
  # SPA at / and reverse-proxies /api -> hub. Open http://localhost:3001.
  ui:
    image: avuru-obs-ui:local
    build:
      context: ../..
      dockerfile: ui/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - hub

  # Jaeger's own demo app, repointed to Avuru by env var alone — the drop-in
  # migration story (agent_docs/architecture.md) demonstrated live.
  demo:
    image: jaegertracing/example-hotrod:2.19.0
    command: ["all"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://gateway:4318
    ports:
      - "8088:8080" # HotROD UI
    depends_on:
      - gateway

  # Mock OIDC IdP for the OPT-IN SSO e2e — never part of the default stack
  # (compose profiles: plain `docker compose up` ignores it entirely). The
  # hub-side wiring (env + config mount) lives in docker-compose.oidc-e2e.yaml;
  # see that file's header for the full recipe.
  #
  # JSON_CONFIG (schema: navikt/mock-oauth2-server OAuth2Config):
  #   - interactiveLogin=false — /authorize 302s straight back with a code
  #     (the image's standalone default is true, which serves a login form;
  #     e2e/oidc_test.go handles that form defensively anyway).
  #   - the token callback pins the identity minted on the code exchange:
  #     `aud` MUST equal the clientId in oidc-e2e.yaml (the hub verifies the
  #     ID token's audience — the mock's fallback aud would fail it), and
  #     `groups` drives the group→grant mapping asserted via /api/v1/auth/me.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:4.0.1
    profiles: ["oidc-e2e"]
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "requestMappings": [
                {
                  "requestParam": "code",
                  "match": "*",
                  "claims": {
                    "sub": "e2e-sso-user",
                    "aud": ["avuru-obs-e2e"],
                    "email": "sso-user@e2e",
                    "name": "E2E SSO User",
                    "groups": ["obs-e2e-viewers"]
                  }
                }
              ]
            }
          ]
        }
    ports:
      # Published for the host-side e2e client, which follows the hub's
      # authorize redirect after rewriting mock-oidc:8080 → localhost:18089
      # (the container-internal issuer host does not resolve on the host).
      - "127.0.0.1:18089:8080"

volumes:
  clickhouse-data:
