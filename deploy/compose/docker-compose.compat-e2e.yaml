# OPT-IN overlay: protocol conformance for the wider-ingest receivers (I-4).
# The default stack is untouched — without this file nothing here exists and
# plain `docker compose up` behaves exactly as before.
#
# One gateway (the LOCALLY BUILT distro — the released image lacks these
# receivers) exposes all four compat protocols with ingest auth in ENFORCE
# mode, plus a forward-sink collector standing in for a legacy backend so
# dual-write can be asserted from its logs:
#
#   jaeger gRPC :24250   zipkin :29411   remote-write v2 :29291   loki :23100
#
# Host ports are remapped wholesale (ports: !override) so this stack can run
# next to a live dev/e2e stack on a shared machine — nothing here touches
# 4317/4318, 18080, 8123 or 3001.
#
# Usage (from repo root — or just `make e2e-compat`, which owns the lifecycle):
#
#   AVURUOBS_AUTH_ADMIN_PASSWORD=e2e-admin-pw docker compose -p avuru-compat-e2e \
#     -f deploy/compose/docker-compose.yaml \
#     -f deploy/compose/docker-compose.compat-e2e.yaml \
#     up -d --build --wait clickhouse hub && \
#   docker compose -p avuru-compat-e2e -f ... up -d --build gateway forward-sink
#
#   cd e2e && AVURUOBS_E2E_COMPAT=1 \
#     AVURUOBS_E2E_HUB_URL=http://localhost:18085 \
#     AVURUOBS_E2E_CH_URL=http://localhost:18124 \
#     go test -tags=e2e -count=1 -run Compat ./...
services:
  hub:
    environment:
      # Registers the validate endpoint and seeds the key the suite sends with,
      # same mechanism as the ingest-e2e overlay.
      AVURUOBS_INGEST_INTERNAL_TOKEN: e2e-internal-token
      AVURUOBS_INGEST_SEED_KEYS: '[{"project":"compat","name":"compat-e2e","key":"avuruk_compat000000000000000000000000"}]'
    ports: !override
      - "18085:8080"

  clickhouse:
    ports: !override
      # HTTP only — the e2e asserts remote-write landings with direct queries.
      - "127.0.0.1:18124:8123"

  gateway:
    volumes: !override
      - ./gateway/config.compat-e2e.yaml:/etc/avuru/config.yaml:ro
    environment:
      AVURUOBS_INGEST_INTERNAL_TOKEN: e2e-internal-token
    ports: !override
      - "24317:4317"             # OTLP gRPC
      - "24318:4318"             # OTLP HTTP (parity baseline)
      - "24250:14250"            # Jaeger gRPC (api_v2.PostSpans)
      - "24268:14268"            # Jaeger thrift-HTTP
      - "29411:9411"             # Zipkin v2 (POST /api/v2/spans)
      - "29291:9291"             # Prometheus remote-write v2 (POST /api/v1/write)
      - "23100:3100"             # Loki push (POST /loki/api/v1/push)
      - "127.0.0.1:23133:13133"  # health_check
    depends_on:
      migrate:
        condition: service_completed_successfully
      hub:
        condition: service_started
      forward-sink:
        condition: service_started

  # Stand-in legacy backend for dual-write: stock contrib collector, OTLP in,
  # debug exporter (verbosity detailed) out — forwarded trace ids show up in
  # `docker logs`, no published ports needed.
  forward-sink:
    image: otel/opentelemetry-collector-contrib:0.159.0
    volumes:
      - ./gateway/config.compat-e2e-sink.yaml:/etc/otelcol-contrib/config.yaml:ro
