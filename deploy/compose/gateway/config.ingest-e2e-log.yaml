# Gateway config for the ingest-key e2e (auth Plan C), LOG mode.
#
# This is the drop-in guarantee under test: the authenticator is wired, but an
# unkeyed OTLP sender must still land exactly as it did before ingest keys
# existed. tenantfromauth is deliberately ABSENT — matching the chart, which
# only wires it in enforce mode — so the log-mode pipeline is byte-identical to
# a pre-ingest-keys install.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: avuruingestauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: avuruingestauth

processors:
  resource/tenant:
    attributes:
      - key: avuru.tenant
        value: "default"
        action: upsert
  batch:
    send_batch_size: 4096
    timeout: 2s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: avuru
    password: avuru
    database: otel
    create_schema: false
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_elapsed_time: 60s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  avuruingestauth:
    hub_validate_url: http://hub:8080/internal/v1/ingest-keys/validate
    internal_token: ${env:AVURUOPS_INGEST_INTERNAL_TOKEN}
    mode: log
    cache_ttl: 2s
    stale_grace: 30s

service:
  extensions: [health_check, avuruingestauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/tenant, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [resource/tenant, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [resource/tenant, batch]
      exporters: [clickhouse]
