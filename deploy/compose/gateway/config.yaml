# Gateway collector config for the compose sandbox.
# M1 uses the stock contrib image (pinned); the minimal OCB distro lands in M5.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Sentry SDK ingest (error-tracking module). Permissive CORS so browser SDKs
  # can POST cross-origin; events become OTel log records the hub derives
  # issues from. Project "1" maps to a friendly service name for the sandbox.
  sentry:
    endpoint: 0.0.0.0:4319
    cors:
      allowed_origins:
        - "*"
    projects:
      "1":
        service_name: sentry-demo

processors:
  # Model prompts and completions, dropped before they are written — the same
  # stage the chart renders by default (deploy/helm/avuruobs/templates/
  # gateway-config.yaml, gateway.genai.redactContent). It lives here too so the
  # sandbox and the e2e run the shipped behaviour rather than a friendlier one.
  #
  # The pattern is anchored: gen_ai.usage.prompt_tokens is a token COUNT and
  # must survive. Span events keep their name and lose their attributes.
  transform/genai:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'delete_matching_keys(span.attributes, "^gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|content)")'
      - context: spanevent
        statements:
          - 'delete_matching_keys(spanevent.attributes, "^gen_ai\\.(prompt|completion|input|output|system_instructions|content)")'
    log_statements:
      - context: log
        statements:
          - 'delete_matching_keys(log.attributes, "^gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|content)")'
  batch:
    send_batch_size: 4096
    timeout: 2s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: avuru
    password: avuru
    database: otel
    # Schema is OWNED by gateway/schemas/ migrations (see schemas/README.md).
    create_schema: false
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_elapsed_time: 60s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/genai, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp, sentry]
      processors: [transform/genai, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
