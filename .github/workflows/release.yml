name: release

# Cuts a release when a vX.Y.Z tag is pushed (see RELEASING.md). Can also be run
# manually with a tag input, and supports a dry-run that builds without pushing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        description: "Build only; do not push images or publish the release"
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

env:
  REGISTRY: ghcr.io
  # Images publish as <IMAGE_PREFIX>-hub / -ui. Override the registry/owner here
  # when a canonical registry is wired (see RELEASING.md).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/avuru-obs

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"                       # strip leading v
          minor="v$(echo "$version" | cut -d. -f1,2)"   # vX.Y
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac   # pre-release if it has a suffix
          dry="${{ github.event.inputs.dry_run || 'false' }}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=$minor"
            echo "prerelease=$pre"
            echo "dry_run=$dry"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$tag version=$version minor=$minor prerelease=$pre dry_run=$dry"

  images:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # cosign keyless signing (Fulcio/Rekor) via GH OIDC
    strategy:
      matrix:
        include:
          - component: hub
            dockerfile: hub/Dockerfile
          - component: ui
            dockerfile: ui/Dockerfile
          - component: gateway
            dockerfile: gateway/Dockerfile
          - component: tdp-estimator
            dockerfile: sensor/tdp-estimator/Dockerfile
    steps:
      # Explicit ref: on workflow_dispatch the default checkout is the branch
      # HEAD, which by then carries the next -SNAPSHOT — the dispatch fallback
      # must build the tag's content, not main's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      # arm64 is not optional: the sensor's eBPF stack and the gateway run on
      # arm64 nodes, and an amd64-only image strands those clusters. QEMU is the
      # baseline that needs no Dockerfile change; if build time becomes painful,
      # cross-compile instead (--platform=$BUILDPLATFORM + GOARCH=$TARGETARCH).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - name: Log in to registry
        if: needs.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@v7
        env:
          # No *.dockerbuild build-record artifacts: the release job downloads
          # run artifacts and must only ever see the helm chart (v0.1.0 cut
          # failed on a .dockerbuild blob that errored after 5 retries). SBOM and
          # provenance below are unaffected — they attach to the registry index,
          # not to run artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.dry_run != 'true' }}
          # Attestations need a registry to attach to, so they only make sense
          # on a real push; a dry run just proves both arches build.
          provenance: ${{ needs.meta.outputs.dry_run != 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.meta.outputs.dry_run != 'true' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
          # Three tags: the git tag (vX.Y.Z), the moving minor (vX.Y), and the
          # bare SemVer (X.Y.Z). The bare form is what the chart resolves to
          # when an image tag is left empty — Helm's .Chart.AppVersion carries
          # no leading "v" — so publishing it is what makes a default
          # `helm install` pull without any --set.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ needs.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ needs.meta.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ needs.meta.outputs.version }}
      # Sign the multi-arch index by digest: one signature then covers every
      # platform manifest under it, and a digest cannot be moved the way a tag
      # can. Verification recipe lives in RELEASING.md.
      - name: Sign ${{ matrix.component }} (keyless)
        if: needs.meta.outputs.dry_run != 'true'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  chart:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the chart to GHCR as an OCI artifact
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v3
      # cosign resolves registry credentials from the Docker credential store;
      # `helm registry login` below writes helm's own config, which cosign never
      # reads — without this login the signature push is anonymous and GHCR
      # rejects it (this failed the v0.2.0 cut).
      - name: Log in to registry
        if: needs.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Helm chart
        run: |
          helm lint deploy/helm/avuruobs
          helm package deploy/helm/avuruobs \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ needs.meta.outputs.version }}" \
            --destination dist
      # The chart is the install path, so it ships to the registry beside the
      # images: `helm install oci://…` needs no repo to be added and reuses the
      # GHCR credentials we already have. The .tgz stays attached to the GitHub
      # Release as the offline fallback for clients that cannot reach a registry.
      - name: Push chart to OCI and sign it
        if: needs.meta.outputs.dry_run != 'true'
        env:
          CHART_NS: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          VERSION: ${{ needs.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pipefail matters: the default shell would hide a failing `helm push`
          # behind tee's exit code.
          set -euo pipefail
          helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin <<<"$GH_TOKEN"
          helm push "dist/avuruobs-${VERSION}.tgz" "oci://${CHART_NS}" 2>&1 | tee push.log
          # Sign the chart by digest, exactly like the images.
          digest="$(awk '/^Digest: /{print $2}' push.log)"
          test -n "$digest" || { echo "helm push printed no digest"; exit 1; }
          cosign sign --yes "${CHART_NS}/avuruobs@${digest}"
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  # Client binaries. Built for the platforms an operator's laptop and a CI
  # runner actually are, with the version stamped in so `avuruobs version`
  # answers something meaningful. Static (CGO off) so the binary runs on any
  # base image, including the scratch ones CI jobs like.
  cli:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build binaries
        working-directory: clients/cli
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/avuruobs_${os}_${arch}${ext}"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "$out" ./cmd/avuruobs
          done
          ( cd dist && sha256sum * > checksums.txt )
      - uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: clients/cli/dist/*
          if-no-files-found: error

  # The Grafana data source ships as a plugin zip: the AMD frontend bundle, the
  # manifest, and one backend binary per platform Grafana runs on. All of them
  # in one archive, because Grafana picks the binary matching its own host at
  # load time and a per-platform zip would make the operator do that lookup.
  grafana-plugin:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: clients/grafana-datasource
        env:
          PLUGIN_VERSION: ${{ needs.meta.outputs.version }}
        run: npm ci && npm run build
      - name: Build backend binaries
        working-directory: clients/grafana-datasource
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w" \
              -o "dist/gpx_avuru_obs_${os}_${arch}${ext}" ./pkg
          done
      - name: Package
        working-directory: clients/grafana-datasource
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cp -r dashboards dist/dashboards
          mkdir -p package/avuru-obs-datasource
          cp -r dist/* package/avuru-obs-datasource/
          ( cd package && zip -qr "../avuru-obs-datasource-${VERSION}.zip" avuru-obs-datasource )
          sha256sum "avuru-obs-datasource-${VERSION}.zip" > "avuru-obs-datasource-${VERSION}.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: grafana-plugin
          path: |
            clients/grafana-datasource/avuru-obs-datasource-*.zip
            clients/grafana-datasource/avuru-obs-datasource-*.zip.sha256
          if-no-files-found: error

  release:
    needs: [meta, images, chart, cli, grafana-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          # Only the chart — never "all artifacts": with a single name the
          # files land directly under path (no per-artifact subdirectory).
          name: helm-chart
          path: artifacts/helm-chart
      - uses: actions/download-artifact@v8
        with:
          name: cli-binaries
          path: artifacts/cli
      - uses: actions/download-artifact@v8
        with:
          name: grafana-plugin
          path: artifacts/grafana-plugin
      - name: Extract changelog notes
        id: notes
        run: |
          ver="${{ needs.meta.outputs.version }}"
          # Pull the section for this version from CHANGELOG.md, if present.
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for details." > notes.md; fi
      # Attach the installer and its checksum so the pinned-per-tag copy users
      # pipe to sh can be verified. Committing a checksum next to the script
      # would go stale on every edit and nothing would check it; the release is
      # the immutable point where a checksum is meaningful.
      - name: Stage installer + checksum
        run: |
          mkdir -p artifacts/installer
          cp deploy/install.sh artifacts/installer/install.sh
          sha256sum deploy/install.sh | sed 's# .*/# #' > artifacts/installer/install.sh.sha256
      - name: Create GitHub Release
        if: needs.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            artifacts/helm-chart/*.tgz
            artifacts/installer/install.sh
            artifacts/installer/install.sh.sha256
            artifacts/cli/*
            artifacts/grafana-plugin/*
      - name: Dry-run summary
        if: needs.meta.outputs.dry_run == 'true'
        run: echo "Dry run — built images and chart, skipped push and release for ${{ needs.meta.outputs.tag }}"
