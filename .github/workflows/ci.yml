name: ci

on:
  push:
    branches: [main, "v*"]
  pull_request:

# Mirrors `make check` (per-component) + helm validation. Author-fresh — not a
# port of Kiali's Istio-heavy matrix.
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: build + test
        working-directory: hub
        run: go build ./... && go test -race ./...
      - name: golangci-lint
        # v9 only changes the action's own runtime to node24; its
        # golangci-lint support is unchanged from v8 (>= v2.1.0), so the
        # pin below and hub/.golangci.yml `version: "2"` both still hold.
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: hub
          # Pinned: `latest` resolves the version via the GitHub API at run
          # time, which rate-limits on shared runners (observed failing a
          # docs-only PR) and silently drifts lint rules between runs.
          version: v2.13.1

  # The in-repo gateway modules are separate Go modules that the hub job never
  # touches. Before this job they were only ever compiled — as a side effect of
  # the image build — so their tests never ran in CI. That is not good enough
  # for avuruingestauth, which decides whether telemetry is authenticated, and
  # tenantfromauth, which decides which tenant it lands in.
  gateway-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [sentryreceiver, avuruingestauth, tenantfromauth]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: build + vet + test
        working-directory: gateway/${{ matrix.module }}
        run: go build ./... && go vet ./... && go test ./...

  # The client binaries under clients/ are separate Go modules with their own
  # toolchains — same rationale as gateway-modules below: they must not weigh on
  # the hub build, and a break in one is not a break in the platform.
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [cli, grafana-datasource]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: build + vet + test
        working-directory: clients/${{ matrix.client }}
        run: go build ./... && go vet ./... && go test ./...

  # The Grafana data source's frontend half. Its own job because it needs Node,
  # and because a plugin that type-checks but does not BUILD is a plugin Grafana
  # silently refuses to load.
  grafana-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build the plugin frontend
        working-directory: clients/grafana-datasource
        run: npm ci && npm run typecheck && npm run build
      - name: the built bundle must externalize Grafana's own packages
        working-directory: clients/grafana-datasource
        # A plugin bundling its own React fights the host's singletons and
        # breaks hooks at runtime — which no type check can see.
        run: |
          head -c 400 dist/module.js | grep -q 'define(\[' \
            || { echo "module.js is not an AMD bundle"; exit 1; }
          grep -q '"executable": "gpx_avuru_obs"' dist/plugin.json \
            || { echo "plugin.json lost its backend executable"; exit 1; }

  # The in-repo sensor modules (first-party additions to the DaemonSet, like
  # tdp-estimator) are separate Go modules the hub job never touches — same
  # rationale as gateway-modules above.
  sensor-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [tdp-estimator]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: build + vet + test
        working-directory: sensor/${{ matrix.module }}
        run: go build ./... && go vet ./... && go test ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: lint + static-export build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # deploy/helm/template-test.sh: lints the chart against the default,
      # staging and prod overlays and makes 40+ renders with assertions on what
      # actually comes out — a strict superset of `helm lint` + `helm template
      # > /dev/null`, which only proved the chart renders, not that it renders
      # the right thing. It is what catches ingest-key secret material escaping
      # a Secret object into a ConfigMap.
      - name: lint + render-time assertions
        run: make helm-check
      # The one case template-test.sh does not cover.
      - name: template against external ClickHouse
        run: |
          helm template avuruobs deploy/helm/avuruobs \
            --set clickhouse.external.enabled=true \
            --set clickhouse.external.address=ch:9000 \
            --set clickhouse.external.existingSecret=ch > /dev/null

  # Real install smoke on a kind cluster (deploy/helm/e2e-helm.sh owns the
  # lifecycle: build+load images → helm install → seed OTLP → assert via the
  # hub API). This is the seed of the M5 time-to-value gate — later milestones
  # extend the script with the sensor DaemonSet and the <5-min wedge assertion.
  e2e-helm:
    runs-on: ubuntu-latest
    # 30, not 25: the wider-ingest leg adds a forward-sink Deployment, four
    # protocol sends and two ClickHouse/log polls to the same install. The
    # budget was already close on a cold runner, and a gate that times out
    # teaches people to re-run it rather than read it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - name: helm install smoke (kind)
        run: make e2e-helm

  # UI smoke (Playwright) against the seeded compose stack. `make e2e-ui` owns
  # the lifecycle: build the images, seed deterministic OTLP fixtures, run the
  # specs, tear down.
  #
  # This gate exists because its absence cost us: the specs are the ONLY
  # automated check on the golden screens, and running them by hand meant a
  # fixture change could silently age three of them out — which it did, twice,
  # unnoticed across two releases. A test nobody runs is documentation with a
  # worse failure mode.
  #
  # Chromium only. The specs assert product behaviour, not browser
  # compatibility, and a second engine doubles the runtime to re-answer a
  # question this suite was never asking.
  e2e-ui:
    runs-on: ubuntu-latest
    # The compose stack builds hub, gateway and ui images from source before a
    # single spec runs; 30 leaves room for a cold runner without inviting a
    # timeout that teaches people to re-run rather than read.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install ui deps
        working-directory: ui
        run: npm ci
      - name: install browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: playwright smoke (compose)
        run: make e2e-ui
      - name: upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  # Build each image and scan it for known OS/library CVEs. The UI carries a real
  # OS (nginx-alpine) and is where fixable base-image CVEs surface (Harbor flagged
  # OpenSSL/zlib/expat); hub and gateway are distroless and near-empty, scanned
  # for the same guarantee. ignore-unfixed keeps the gate honest — it only fails
  # on CVEs that actually have a patched version available.
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: ui, dockerfile: ui/Dockerfile }
          - { component: hub, dockerfile: hub/Dockerfile }
          - { component: gateway, dockerfile: gateway/Dockerfile }
          - { component: tdp-estimator, dockerfile: sensor/tdp-estimator/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Single-arch load: package CVE scanning is arch-independent, so QEMU/arm64
      # would only cost build time here.
      - name: build ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: avuru-obs-${{ matrix.component }}:scan
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: avuru-obs-${{ matrix.component }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
