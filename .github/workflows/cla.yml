# CLA enforcement via contributor-assistant (CLA Assistant Lite).
#
# Self-contained: no external service — the check runs in Actions, the CLA
# text is CLA.md on main, and signatures are recorded as JSON commits on the
# `cla-signatures` branch of this repo. Contributors sign by posting the
# exact comment quoted below on their first PR; `recheck` re-runs the check.
#
# pull_request_target runs the workflow from the default branch, so
# enforcement begins once this file lands on main.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/avuruvision/avuru-obs/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          allowlist: 'egilberny,dependabot[bot],*[bot]'
