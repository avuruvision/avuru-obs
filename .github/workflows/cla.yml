# CLA enforcement via contributor-assistant (CLA Assistant Lite).
#
# Self-contained: no external service — the check runs in Actions, the CLA
# text is CLA.md on main, and signatures are recorded as JSON commits on the
# `cla-signatures` branch of this repo. Contributors sign by posting the
# exact comment quoted below on their first PR; `recheck` re-runs the check.
#
# pull_request_target runs the workflow from the default branch, so
# enforcement begins once this file lands on main.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # contributor-assistant stores signatures on the orphan `cla-signatures`
      # branch and fails hard when it is missing ("Branch cla-signatures not
      # found") — it never creates the branch itself. A branch cleanup that
      # sweeps it away turns every CLA check red, so recreate it here instead
      # of blocking contributors until a maintainer notices.
      - name: Ensure cla-signatures branch exists
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/heads/cla-signatures" >/dev/null 2>&1; then
            echo "cla-signatures branch present"
            exit 0
          fi
          echo "cla-signatures branch missing - recreating it as an orphan"
          blob=$(jq -n '{content: "{\n   \"signedContributors\": []\n}", encoding: "utf-8"}' \
            | gh api --method POST "repos/$REPO/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg sha "$blob" \
            '{tree: [{path: "signatures/cla.json", mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api --method POST "repos/$REPO/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$tree" \
            '{message: "chore: re-init CLA signatures store", tree: $tree, parents: []}' \
            | gh api --method POST "repos/$REPO/git/commits" --input - --jq .sha)
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref=refs/heads/cla-signatures -f sha="$commit" >/dev/null
          echo "recreated cla-signatures at $commit"

      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/avuruvision/avuru-obs/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          allowlist: 'egilberny,dependabot[bot],*[bot]'
