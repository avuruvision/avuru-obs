# Screenshot-capture overlay for the release sandbox. Layered on top of
# deploy/compose/docker-compose.release.yaml to (a) move every published port
# into a collision-free range so the run can coexist with dev servers and other
# compose projects, and (b) wire the seeded health/alerting/green configs the
# dev sandbox mounts, so /health, /alerts and /green render real content on the
# RELEASED images. Always run under an isolated project name:
#
#   AVURUOPS_VERSION=v0.2.0 docker compose -p avuru-shots \
#     -f deploy/compose/docker-compose.release.yaml \
#     -f tools/screenshots/compose.screenshots.yaml up --wait
#
# See tools/screenshots/README.md for the full capture recipe.
services:
  clickhouse:
    ports: !override
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"

  migrate:
    environment:
      # The release file's module list misses `alerting`, whose 0008_alerts.sql
      # tables /alerts depends on (the hub runs all modules when unset).
      AVURUOPS_MODULES: "core,logs,infra-metrics,profiling,error-tracking,alerting"

  gateway:
    ports: !override
      - "14317:4317"
      - "14318:4318"
      - "127.0.0.1:23133:13133"

  hub:
    environment:
      # Deterministic admin credentials for the capture script (the release
      # image otherwise generates a password and logs it once at first boot).
      AVURUOPS_AUTH_ADMIN_PASSWORD: shots-admin-pw
      # Same seeded-config wiring as the dev sandbox (docker-compose.yaml):
      # tiny seed volumes need minSampleCount 1, alert rules fire on the seeded
      # down service, and green factors make gCO2e deterministic.
      AVURUOPS_GROUPS_CONFIG: /etc/avuruops/groups.json
      AVURUOPS_ALERTS_CONFIG: /etc/avuruops-alerts/alerts.json
      AVURUOPS_GREEN_CONFIG: /etc/avuruops-green/green.json
    # Resolves identically from this file's directory and from the project
    # directory (deploy/compose): both paths land on deploy/compose/*.json.
    volumes:
      - ../../deploy/compose/groups.json:/etc/avuruops/groups.json:ro
      - ../../deploy/compose/alerts.json:/etc/avuruops-alerts/alerts.json:ro
      - ../../deploy/compose/green.json:/etc/avuruops-green/green.json:ro
    ports: !override
      - "127.0.0.1:18081:8080"

  ui:
    ports: !override
      - "13001:80"

  demo:
    ports: !override
      - "18088:8080"
