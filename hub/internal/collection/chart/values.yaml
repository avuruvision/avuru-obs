# Avuru Obs — default values.
# Downstream overlays (e.g. a Harbor/Kustomize project) override image.registry,
# ingress.host, persistence, retention, and clickhouse.external without forking.

nameOverride: ""
fullnameOverride: ""

image:
  # Registry prefixed to every component repository (e.g. "harbor.example.com").
  # Empty = pull from the repository as-is (Docker Hub / GHCR style).
  registry: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Hub: REST API only (the `migrate` subcommand runs the schema hook). The UI is
# a separate deployable; the hub API is the client-agnostic contract.
hub:
  # Install the hub (API + UI backend + migrate Job) in THIS cluster. Turn it
  # off for a secondary cluster that only ships telemetry to a central instance
  # (see `external.url` below and deploy/helm/README.md). A hub-less install
  # must point at the shared store: clickhouse.external.enabled=true.
  enabled: true
  # Where the hub lives when this install does not run one. The gateway needs
  # it to validate per-project ingest keys; without it a hub-less install with
  # ingest auth on would call a Service that does not exist here.
  # Example: https://avuruobs.example.com
  external:
    url: ""
  repository: ghcr.io/avuruvision/avuru-obs-hub
  tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  # Apply missing ClickHouse migrations from the hub itself when it finds the
  # schema incomplete. The migrate Job stays the normal path; this is the safety
  # net for the case that Job never runs — Helm skips post-install/post-upgrade
  # hooks when `--wait` times out, which leaves a healthy-looking install whose
  # every query fails on a missing table. The migrations are idempotent and safe
  # to apply concurrently, so replicas do not need coordinating.
  # Set false when ClickHouse schema is owned elsewhere (a DBA-managed external
  # cluster, or a query-only hub user with no DDL rights).
  autoMigrate: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# UI: static SPA served by nginx, its own pod (separate resources/scaling).
# Single-origin: the ingress routes `/`→ui and `/api`→hub (no CORS).
ui:
  # The UI proxies /api to the hub Service in its own namespace, so it is only
  # installable where the hub is (the chart refuses ui.enabled without
  # hub.enabled rather than rendering a pod that 502s).
  enabled: true
  repository: ghcr.io/avuruvision/avuru-obs-ui
  tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

# Gateway: OTLP receiver → ClickHouse exporter. Default = the Avuru minimal
# OCB distro (gateway/ocb-manifest.yaml). The stock contrib image works with
# the same config — override repository/tag to fall back:
#   otel/opentelemetry-collector-contrib : 0.154.0
# Falling back costs the distro's security floors: the OCB manifest pins
# x/crypto, x/text and grpc above advisories the 0.154.0 contrib image still
# ships, so the stock image scans with one CRITICAL and three HIGHs the
# default image does not have. Stay on 0.154.0 if you do fall back — the
# ClickHouse DDL this chart expects is frozen against that line.
gateway:
  # The ingest path. A secondary cluster installs this (plus the sensor) and
  # nothing else; a query-only instance can turn it off and receive telemetry
  # from elsewhere.
  enabled: true
  image:
    repository: ghcr.io/avuruvision/avuru-obs-gateway
    tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  # Project/environment this gateway feeds (one project per cluster): stamps
  # `avuru.tenant` on ALL telemetry passing through (and the profiler's
  # ingest header). "" = everything lands in the `default` project. Senders
  # never change — this is server-side tagging (drop-in OTLP stays true).
  tenant: ""
  # Per-namespace project mapping for shared clusters hosting several
  # environments: stamps `avuru.tenant` from the sender's k8s.namespace.name
  # resource attribute (set by the sensor). Unmatched telemetry (node metrics,
  # SDKs without k8s attributes) falls back to `tenant` above. Requires the
  # avuruobs gateway image with the transform processor (the stock
  # otel/opentelemetry-collector-contrib fallback image also ships it).
  # NOTE: profiling bypasses the gateway (direct hub ingest) and stays on the
  # static `tenant`.
  tenantByNamespace: {}
  #  avuru-services: production
  #  avuru-services-staging: staging
  # Model prompts and completions (gen_ai content). ON by default, and NOT
  # tied to modules.ai: this text arrives whether or not you run the AI screen,
  # so gating the protection on the screen would protect only the installs that
  # went looking.
  #
  # Content reaches this gateway only because an application's own SDK was
  # configured to capture it — nothing here asks for it. Left alone it is user
  # text, stored under your ordinary trace retention and rendered in the trace
  # view to every Viewer. This drops it before it is written; the span event
  # that carried it survives, emptied, so you can still see that your
  # instrumentation is emitting content.
  #
  # Set false ONLY if you have decided you want prompts stored, and have a
  # retention and access story for them. Token counts, models, latency and cost
  # are unaffected either way — those are attributes, not content.
  genai:
    redactContent: true
  # Sentry SDK ingest (error-tracking module). OFF by default: it opens a
  # network surface (:4319) for browser/app error reporting. Needs the
  # error-tracking AND logs modules (events are stored as log records). Expose
  # :4319 via ingress for browser clients; CORS must allow their origins.
  sentry:
    enabled: false
    allowedOrigins:
      - "*"
    projects: {}
  # Wider ingest compatibility (design/2026-07-27-wider-ingest-compat.md):
  # native receivers for the senders a fleet already runs, each opt-in and OFF
  # by default. The gateway binary always ships the components; a flag wires
  # the listener, container/Service ports and pipeline entry together. Every
  # enabled receiver honors ingest keys exactly like OTLP (auth.ingest.mode) —
  # senders attach the key as `Authorization: Bearer <key>`. In-cluster ports
  # only; external exposure is an ingress recipe (deploy/helm/README.md), not
  # chart surface.
  receivers:
    # Jaeger gRPC (:14250) and thrift-HTTP (:14268). The UDP thrift protocols
    # are deliberately not offered: no authenticator hook, and jaeger-agent is
    # deprecated upstream.
    jaeger:
      enabled: false
    # Zipkin v2 JSON/protobuf (:9411, POST /api/v2/spans).
    zipkin:
      enabled: false
    # Prometheus Remote-Write (:9291, POST /api/v1/write). v2 ONLY at the
    # pinned collector line — a v1 sender gets HTTP 415. Senders need
    # Prometheus >= 3.8.0 with `protobuf_message: io.prometheus.write.v2.Request`
    # (and its metadata-wal-records feature flag). Requires modules.infraMetrics
    # (samples land in otel_metrics_*); silently inert without it, like sentry.
    prometheusRemoteWrite:
      enabled: false
    # Loki push (:3100, POST /loki/api/v1/push, JSON + snappy protobuf) — the
    # port matches Loki's own so promtail/Alloy re-point by hostname alone.
    # Stream labels land as log-RECORD attributes; entry timestamps are kept.
    # Requires modules.logs; silently inert without it, like sentry.
    loki:
      enabled: false
  # Dual-write forwarding during migrations: keep the legacy backend fed while
  # avuru-obs takes over (or the reverse on the way out). Best-effort BY
  # DESIGN: forward exporters always run behind a sending queue with bounded
  # retry, so a dead target can never backpressure the ClickHouse path — a
  # burst beyond the queue drops forwarded data, never stored data.
  forward:
    otlp:
      enabled: false
      # Required when enabled — host:port for grpc, a full URL for http.
      endpoint: ""
      protocol: grpc # grpc | http
      # Skip TLS entirely (plaintext) — for in-cluster targets.
      insecure: false
      # Static headers on every export (e.g. the target's auth token). Values
      # land in the gateway ConfigMap — put secrets in the target's namespace
      # boundary, or front the target with its own auth proxy.
      headers: {}
      # Which signals to forward; intersected with the pipelines this install
      # actually runs (a signal whose module is off is skipped, not an error).
      signals: [traces, logs, metrics]
    kafka:
      enabled: false
      # Required when enabled.
      brokers: []
      # Per-signal topics (the exporter's own defaults, made explicit).
      topics:
        traces: otlp_spans
        logs: otlp_logs
        metrics: otlp_metrics
      encoding: otlp_proto
      tls:
        enabled: false
        insecureSkipVerify: false
      # SASL credentials come ONLY from an existing Secret (keys:
      # sasl-username, sasl-password), referenced as ${env:...} — inline
      # credentials would land in the gateway ConfigMap.
      sasl:
        enabled: false
        mechanism: SCRAM-SHA-512 # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
        existingSecret: ""
      signals: [traces, logs, metrics]
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

# Modules: which signal families this install runs. One switch gates a module
# end to end — its schema (`hub migrate` skips the DDL), its Hub API routes
# (404 when off), its gateway pipeline, its sensor collection, and its UI
# entry. The service map + traces + RED core is always on and has no switch.
# Defaults enable everything: an existing install upgrades unchanged.
# Turning a module on later is a values change + `helm upgrade` (the migrator
# is idempotent and applies the newly-active DDL).
modules:
  logs:
    enabled: true
  # Node/pod metrics AND the sensor inventory (it reads collector
  # self-metrics), plus any OTLP metrics you send: all live in these tables.
  infraMetrics:
    enabled: true
  profiling:
    enabled: true
  # Error tracking: exceptions (span events, error spans, ERROR/FATAL logs)
  # become deduplicated, triageable issues. Default on — it derives from data
  # you already send. The Sentry-SDK ingest PORT is a separate opt-in
  # (gateway.sentry.enabled), off by default.
  errorTracking:
    enabled: true
  # Service health: rolls per-service RED health up into consolidated group
  # health with criticality tiers (T0/T1/T2/T3) and dependency propagation.
  # Derived from trace data you already send — owns no schema. See
  # serviceGroups below for the grouping/tier configuration.
  serviceHealth:
    enabled: true
  # Alerting: a hub evaluator watches service-health status and fires a webhook
  # when a rule's target crosses into a bad state for a duration. Default on but
  # INERT until you configure rules below (alerting.rules). The webhook is the
  # hub's only outbound call — guarded (SSRF, retries, HMAC).
  alerting:
    enabled: true
  # Green: per-service energy (Wh) and carbon (gCO2e) derived from the Kepler
  # energy metrics the sensor scrapes, correlated with the pod→workload map.
  # Born OFF: the signal is hardware-dependent (RAPL/powercap), so a default-on
  # module would silently flip on for every existing install on the next
  # upgrade. REQUIRES modules.infraMetrics (the pod→workload join reads the
  # kubeletstats attributes) — a chart guard enforces it. Collect energy by ALSO
  # setting sensor.green.enabled; see the green: and sensor.green: blocks below.
  # Mesh: the service mesh's own surface — proxy load/latency/success rate from
  # spans you already send, plus control-plane health from an istiod scrape
  # (see the mesh: block below). Born OFF: most installs run no mesh, and a
  # module that lights up a nav entry for infrastructure you do not have is
  # exactly what the grouped navigation set out to stop. The control-plane half
  # additionally REQUIRES modules.infraMetrics (the scraped series live in the
  # otel_metrics_* tables) — a chart guard enforces it.
  mesh:
    enabled: false
  green:
    enabled: false
  # Cost: what each workload RESERVED against what it actually used — the
  # capacity you are paying for and not drawing on. Born OFF for two reasons
  # that both matter at upgrade: it starts watching cluster-scoped objects, and
  # it takes a coordination.k8s.io Lease, neither of which an install had
  # before. REQUIRES modules.infraMetrics — the "used" half of every number it
  # prints is the kubeletstats series that module owns — enforced by a chart
  # guard. Collect by ALSO setting sensor.agent.cluster.enabled; see the cost:
  # and sensor.agent.cluster: blocks below.
  cost:
    enabled: false
  # AI observability: the model calls your applications already send —
  # per-model tokens, latency, failures, truncation and, if you price them,
  # money. Reads the gen_ai.* attributes on spans you are already storing:
  # no schema, no collection, no dependency on another module.
  # Born OFF for the same reason as mesh — most installs call no models, and a
  # nav entry for something you do not have is noise. Turning it OFF does NOT
  # turn off prompt redaction; that is gateway.genai.redactContent.
  ai:
    enabled: false

# Mesh control plane. Rendered into the GATEWAY's collector config, not the
# sensor's: istiod is a single Deployment, and the sensor is a DaemonSet, so
# scraping it from there would produce one copy of every control-plane series
# per node. Only effective with modules.mesh.enabled + modules.infraMetrics.
#
# ISTIO-SHAPED, deliberately. The four questions this answers — proxies
# connected, pushes attempted, configuration REFUSED, convergence latency — are
# istiod's pilot_* metrics, and other control planes do not publish the same
# four facts (Linkerd's destination controller has no "configuration the
# proxies refused" at all). Point this at a non-Istio control plane and the
# screen will say it reached something it could not read, rather than render an
# empty card. The PROXY half of the mesh screen works anywhere a proxy is
# classified.
mesh:
  controlPlane:
    enabled: false
    # istiod's Prometheus port. 15014 is the `http-monitoring` port on the
    # istiod Service; change the host for a revisioned or renamed control plane
    # (e.g. istiod-1-20.istio-system.svc.cluster.local:15014).
    endpoint: istiod.istio-system.svc.cluster.local:15014
    # The Prometheus job name. It is ALSO what the hub looks the scrape-report
    # series up by, to tell "nobody is scraping" from "the target is not
    # answering" from "it answered with metrics we cannot read" — so it is one
    # value reaching both, never the same string typed in two places.
    jobName: istiod
    scrapeInterval: 30s
    metrics:
      # istiod exposes hundreds of series; this surface asks four questions.
      # pilot_xds = proxies connected, pilot_xds_pushes = pushes attempted,
      # pilot_proxy_convergence_time = how long config takes to arrive,
      # pilot_total_xds_rejects = config the proxies REFUSED — the one signal
      # nothing else in the product can produce.
      keep: "pilot_xds|pilot_xds_pushes|pilot_proxy_convergence_time.*|pilot_total_xds_rejects"

# Cost. Rates are yours to declare: this product makes no outbound call, so
# there is no pricing API to look them up, and inventing a number would be
# worse than showing none. Left unset, the screens report cores and bytes and
# say that no rates are configured; set, they also report money.
#
# Both are per hour of RESERVED capacity — what the scheduler set aside, which
# is what a node is sized (and billed) for, not what the process touched.
cost:
  rates:
    # e.g. 0.0331 for a machine costing ~$24/vCPU/month.
    cpuCoreHour: 0
    memGiBHour: 0
    currency: ""

# Token prices for the AI module, per MILLION tokens — which is how every
# provider publishes them. Rendered to a ConfigMap the hub reads (mounted at
# AVURUOBS_AI_CONFIG) when modules.ai.enabled, and hot-reloaded on a
# `kubectl edit`.
#
# Unset (the default) is a real answer: the screens report token counts and say
# that is what they are reporting. There is no bundled price table — it would
# be stale within a month and would carry a wrong number with the confidence of
# a right one — and no pricing API, which would be the first outbound call in a
# product whose promise is that nothing leaves the cluster.
#
# `model` matches the id in your telemetry exactly, or as a PREFIX of it:
# pricing "gpt-4o" also prices "gpt-4o-2024-08-06". An exact entry always wins
# over a prefix, and the longest prefix wins among prefixes. A cost derived
# from a prefix is marked as such on the screen.
ai:
  currency: ""
  prices: []
  #  - model: gpt-4o
  #    inputPer1MTokens: 2.5
  #    outputPer1MTokens: 10
  #  - model: claude-sonnet
  #    inputPer1MTokens: 3
  #    outputPer1MTokens: 15

  # Monthly ceilings on spend. Each budget fires two rules through the SAME
  # alerting tick green's carbon budgets use — ai:<name>:warn at warnRatio
  # (default 0.8) and ai:<name>:over at the limit — so they need the alerting
  # module on and deliver through an alerting channel by name.
  #
  # `scope` is a calling service, or omitted for the whole estate. Set exactly
  # ONE of monthlyTokens or monthlyCost: a budget in money needs prices above,
  # and is REFUSED at startup without them, because spend measured with no
  # prices is zero and such a budget could never fire.
  budgets: []
  #  - name: estate-tokens
  #    monthlyTokens: 50000000
  #    channel: ops
  #  - name: assistant-spend
  #    scope: assistant
  #    monthlyCost: 400
  #    warnRatio: 0.75
  #    channel: ops

# Alerting rules and channels. Rendered to a ConfigMap the hub reads (mounted at
# AVURUOBS_ALERTS_CONFIG) when modules.alerting.enabled. No rules = nothing
# fires. Hot-reloads within ~15s on a `kubectl edit`, no restart. A channel is a
# generic webhook (Slack/PagerDuty/Opsgenie/Alertmanager all accept these).
alerting:
  evalIntervalSec: 30
  windowMinutes: 5
  # CIDRs that override the SSRF guard so alerting can reach a webhook receiver
  # on a private network (e.g. an in-cluster Alertmanager). Default: none —
  # loopback/link-local/private/metadata targets are refused.
  webhookAllow: []
  #  - 10.0.0.0/8
  channels: []
  #  - name: ops
  #    type: webhook
  #    url: https://hooks.example.com/services/xxx
  #    secret: "optional-hmac-signing-secret"
  rules: []
  #  - name: payments-critical
  #    when: down            # down | degraded | not-healthy
  #    for: 5m
  #    selector:
  #      groups: [payments]  # or services: [...] or tiers: [T0]
  #    channel: ops

# Service-map topology: which workloads are TRANSPORT (a service-mesh sidecar,
# waypoint or ztunnel proxy, an ingress/egress gateway) rather than
# applications. Transport carries other services' traffic, so it appears in
# traces and in kernel flows exactly like a peer — and without this the map
# draws every `app -> proxy -> app` hop as two application dependencies,
# claiming a relationship between services that never talk to each other. The
# map hides transport by default and offers a toggle to show it.
#
# Empty means "use the built-in patterns" (Istio sidecar/waypoint/ztunnel and
# gateways, Linkerd, Consul, Kuma, Envoy Gateway) — right for almost every
# install. Rendered to a ConfigMap the hub reads (AVURUOBS_TOPOLOGY_CONFIG) and
# hot-reloads within ~15s, so a correction needs no restart or helm upgrade.
# Business tags: Kubernetes pod labels carried onto every signal as
# avuru.tag.<key> resource attributes, so telemetry can be sliced by the words
# your org already stamps on its workloads (team, tier, cost-center) instead of
# only by service and namespace. Nothing is mapped by default.
#
# The key on the left is the tag name; the value is the pod label it reads.
#
# tags:
#   labels:
#     team: team
#     tier: app.kubernetes.io/component
#     cost-center: finance.example.com/cost-center
#
# Applied where telemetry is collected — the sensor's log/metric enrichment and
# the eBPF tracer's Kubernetes decoration — so no application changes anything.
# TWO CONSEQUENCES worth knowing before you map a label:
#
#   1. A service that sends OTLP straight to the gateway is not decorated by
#      this: nothing in that path reads the Kubernetes API. Such a service
#      declares its own resource attributes, and can set avuru.tag.* among them.
#   2. Every distinct value becomes a series dimension on the metrics it
#      touches. Map identity (team, tier, owner), never anything unbounded like
#      a commit SHA or a pod-specific annotation. A cap on the number of mapped
#      keys is enforced at template time.
tags:
  labels: {}

topology: {}
  # Add patterns for a mesh or gateway the built-ins don't know about. Globs
  # (* and ?), matched case-insensitively against the workload name and against
  # each dot-separated segment, so one pattern covers both "my-proxy" and
  # "my-proxy.mesh-system".
  # transport:
  #   - "acme-mesh-*"
  #
  # Rescue a real application the patterns catch. Wins over every transport
  # pattern, built-in or added — this is how you fix a false positive without
  # waiting for a release.
  # applications:
  #   - "waypoint-api"
  #
  # Drop the built-in list entirely and classify only what `transport` lists.
  # For an install whose naming collides often enough that subtracting is
  # harder than starting from nothing. Requires a non-empty `transport`.
  # disableDefaults: true

# Service Health grouping/tier configuration. Rendered to a ConfigMap the hub
# reads (mounted at AVURUOBS_GROUPS_CONFIG) when modules.serviceHealth.enabled.
# Empty groups = auto-group every service by its Kubernetes namespace at
# defaultTier. Edit and `helm upgrade`, OR `kubectl edit` the rendered
# ConfigMap — the hub hot-reloads it within ~15s, no restart or redeploy.
serviceGroups:
  # Tier applied to services not matched by any group below. T0|T1|T2|T3.
  defaultTier: T2
  # Named groups override the namespace auto-grouping. A service matches by
  # explicit name or by namespace.
  groups: []
  #  - name: payments
  #    tier: T0
  #    selector:
  #      namespaces: [payments]
  #      services: []
  # SLO-lite thresholds. Precedence: services > tiers > defaults > built-in.
  thresholds:
    defaults: {}
    #  errorRateWarn: 0.01
    #  errorRateCrit: 0.05
    #  latencyP95ObjectiveMs: 500
    #  minSampleCount: 5
    tiers: {}
    #  T0: { errorRateWarn: 0.005, errorRateCrit: 0.02, latencyP95ObjectiveMs: 300 }
    services: {}
    #  payments: { latencyP95ObjectiveMs: 800 }
  # Endpoint checks: scheduled HTTP probes attached to a group
  # (design/2026-07-20-endpoint-checks.md). They add the one signal that cannot
  # be derived from observed traffic — what happens when there is NO traffic. A
  # group with no spans in the window is either idle or dead, and only a probe
  # tells the two apart at 3 a.m.
  #
  # Declared per group, below `groups`. Zero checks = no scheduler, no rows, no
  # behaviour change. Two consecutive failures move a group, not one: a single
  # failed probe is a restart or a dropped packet, and a board that reacts to
  # one is a board people stop reading.
  #
  #  - name: core
  #    tier: T0
  #    selector: { namespaces: [storefront] }
  #    checks:
  #      - id: core-login
  #        url: https://app.example.com/api/health
  #        interval: 60s
  #        expect: { status: 200, maxLatency: 800ms }
  #
  # Each probe emits a span of its own, so a check appears in RED, on the map
  # and in the trace explorer like any other client — which is what lets a
  # failing check link straight to the request that failed. There is no SSRF
  # guard here, unlike alerting's webhooks: a check exists to probe YOUR OWN
  # services, on exactly the private networks that guard blocks.
  #
  # Force specific edges critical even when the target isn't T0 (rare).
  criticalEdges: []
  #  - { from: web, to: legacy-billing }

# Green energy/carbon configuration. Rendered to a ConfigMap the hub reads
# (mounted at AVURUOBS_GREEN_CONFIG) when modules.green.enabled. gCO2e is
# computed at query time as Wh × gridIntensity/1000 × PUE — energy never leaves
# the cluster and no external API is called. The hub hot-reloads this within
# ~15s on a `kubectl edit`, no restart. Metric names must match the Kepler
# series the sensor keeps (sensor.green.metrics.keep); the single source of
# truth is design/2026-07-22-green-carbon.md.
green:
  # ISO 3166-1 alpha-2 country selecting a bundled annual-average grid intensity
  # (gCO2e/kWh). "" = world average. Ignored when gridIntensity is set; an
  # unknown code with no gridIntensity fails the hub loud (no silent fallback).
  region: ""
  # Operator-set grid carbon intensity (gCO2e/kWh); wins over the bundled
  # region/world average. 0 = use the bundled lookup.
  gridIntensity: 0
  # Power Usage Effectiveness of the facility (>= 1.0). 0 renders as the hub's
  # conservative 1.5 default; set your datacenter's measured PUE.
  pue: 0
  # Kepler metric/label names the read path queries. Defaults are the pinned
  # v0.11.x names from the AEP metric table; override ONLY to track a Kepler
  # rename (a documented verify-on-hardware item), and keep them in step with
  # sensor.green.metrics.keep.
  metrics:
    podEnergy:
      - kepler_pod_cpu_joules_total
    nodeEnergy:
      - kepler_node_cpu_joules_total
    podNameAttr: pod_name
    podNamespaceAttr: pod_namespace
  # Monthly gCO2e budgets per serviceGroups group: warn at warnRatio (default
  # 0.8 = 80%), exceeded at 100%, with a month-end projection. Delivery reuses
  # the alerting channels (alerting.channels above); with modules.alerting off,
  # budgets degrade to dashboard status only (used/projected/ratio still shown).
  # No budgets = the evaluator is inert.
  budgets: []
  #  - name: platform-monthly
  #    group: payments
  #    monthlyKgCO2e: 50      # kg CO2e per month for the group
  #    warnRatio: 0.8         # warn threshold as a fraction of the budget
  #    channel: ops           # an alerting.channels name
  # How often the budget evaluator recomputes month-to-date usage, in seconds.
  # 0 renders as the hub's 300s default.
  budgetCheckIntervalSec: 0

# Sensor: per-node DaemonSet for zero-code signal collection (eBPF). v0.1
# wires OBI (zero-code traces + RED); the otel-agent (logs, kubeletstats) and
# profiler containers join in later milestones.
# Kernel ≥5.8 with BTF is required for eBPF; a preflight initContainer warns
# loudly (but never blocks) when the node can't support it.
sensor:
  enabled: true
  nodeSelector: {}
  tolerations: []
  # "Do no harm": run the sensor below default priority so that under node
  # pressure it is throttled/evicted BEFORE user applications. Opt-in in the
  # 0.1.x line (scheduling behavior change); values-prod turns it on.
  priorityClass:
    create: false
    name: "" # use an existing PriorityClass instead of creating one
    value: -10
  # Collection guardrails shared by every sensor container. The release's own
  # namespace is ALWAYS excluded in the templates and never listed here.
  collection:
    # Namespaces never collected (traces, logs, pod metrics). OBI's built-in
    # defaults already skip kube-system — listed explicitly so the guarantee
    # doesn't depend on upstream defaults. Set [] to collect everything.
    excludeNamespaces:
      - kube-system
      - kube-node-lease
      - kube-public
    # Pods labeled <optOutLabel>=false are never eBPF-instrumented and their
    # logs/pod-metrics are dropped at the node agent. Escape hatch for
    # probe-sensitive workloads (docs/runbooks/app-probe-failures.md).
    optOutLabel: avuru.obs/instrument
    # Nodes labeled <nodeOptOutLabel>=false get NO sensor pod at all — a pure
    # runtime toggle (kubectl label node), no helm upgrade needed.
    nodeOptOutLabel: avuru.obs/collect
  # Node collector: tails container stdout/stderr (zero-config logs). Infra
  # metrics (kubeletstats) join this container in M3.
  agent:
    enabled: true
    image:
      # The agent needs filelog, kubeletstats, k8s_cluster and prometheus —
      # none of them in the gateway's minimal OCB distro — so it runs the stock
      # contrib image and tracks contrib's OWN line, no longer in lockstep with
      # the gateway pin. It can: the agent's only exporter is otlphttp to the
      # gateway, so it touches no ClickHouse DDL and moving it re-runs no
      # contract freeze. Newer is the security position, measured rather than
      # assumed — trivy --ignore-unfixed --severity HIGH,CRITICAL reports
      # 1 CRITICAL + 14 HIGH on 0.154.0 and 1 CRITICAL + 2 HIGH on 0.159.0.
      # Gone: x/net, x/text, grpc, stdlib. Left: golang.org/x/mod
      # (CVE-2026-56864/56865, fixed in v0.40.0) — on both lines, and no
      # collector release carries the fix yet. The CRITICAL (CVE-2026-56854,
      # x/crypto) has no upstream fix either: 0.159.0 still resolves v0.54.0
      # against the fixed v0.55.0. Only the OCB distro can pin those floors,
      # which is why the gateway does and this image cannot.
      repository: otel/opentelemetry-collector-contrib
      tag: "0.159.0"
    logs:
      enabled: true
      # Parse JSON log bodies in place, so `level` becomes SeverityNumber and
      # `trace_id`/`span_id` become the TraceId/SpanId columns.
      #
      # Without it a structured log line lands as an opaque string with
      # severity 0, and three things silently do nothing: the Logs severity
      # filter matches no container log at all, no log is ever promoted to an
      # error issue, and a trace has no logs to show. Non-JSON lines are
      # untouched either way.
      parseJson: true
    # Node/pod CPU, memory, network from the kubelet (Supporting signal tier).
    kubeletstats:
      enabled: true
      interval: 30s
    # Cluster-scoped objects: what each container REQUESTS and is LIMITED to,
    # and what each node has allocatable. Only effective with modules.cost.
    #
    # Cluster objects are not per-node facts, and this collector is a DaemonSet
    # — so the receiver runs behind a leader-election Lease and exactly one node
    # reports them. Without that every series would be multiplied by node count.
    cluster:
      enabled: true
      interval: 30s
      # Lease name, in the release namespace. Change it only if two avuru-obs
      # installs share a namespace, which they should not.
      leaseName: ""
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # Continuous CPU profiling (OTel eBPF profiler collector distro). Ships
  # OTLP Profiles (ALPHA) directly to the hub's profiles-ingest seam — the
  # gateway's ClickHouse exporter has no profiles support yet.
  # EXPERIMENTAL, opt-in: the upstream eBPF loader hard-fails on some
  # kernels (observed on arm64 lima/colima), and a crash-looping container
  # would block `helm --wait` — enable where your nodes support it.
  profiler:
    enabled: false
    image:
      repository: otel/opentelemetry-collector-ebpf-profiler
      tag: "0.155.0" # pin exact; hub's profilesadapter is pinned to the same line
    # 19-29 Hz is the sane production band; higher = more detail, more CPU.
    samplesPerSecond: 20
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  obi:
    enabled: true
    image:
      repository: otel/ebpf-instrument
      tag: "v0.12.2" # pre-1.0 — pin exact, never float (agent_docs/tech_stack.md)
    # privileged=true is the reliable default across container runtimes and
    # kernels. Set false to run with the least-privilege capability set
    # (BPF/PERFMON/SYS_PTRACE/NET_RAW/CHECKPOINT_RESTORE/DAC_READ_SEARCH/
    # SYS_RESOURCE) instead — needs kernel ≥5.11.
    privileged: true
    # Discovery scope for zero-code L7 instrumentation (uprobes). `namespaces`
    # is a glob allowlist; excludes extend sensor.collection.excludeNamespaces.
    # NOTE: the CPU limit bounds only OBI's userspace half — uprobe overhead
    # runs in the TARGET process and is charged to the app's cgroup (see
    # docs/runbooks/app-probe-failures.md).
    # MITIGATION for neighbour-pod impact: NARROW `namespaces` to the services
    # that actually need L7 spans and turn on `network.enabled` below — the
    # service map stays complete via kernel flows (no uprobes), while the heavy
    # L7 instrumentation is scoped down. Also consider priorityClass and moving
    # ClickHouse off the app nodes (runbook cause #2).
    discovery:
      # optOut (default): instrument everything in `namespaces` minus the
      # excludes. optIn: uprobes ONLY on pods labeled <optOutLabel>="true";
      # logs/metrics/inventory unaffected (docs/runbooks/sensor-rollout.md).
      mode: optOut
      namespaces: ["*"]
      excludeNamespaces: []
    # Network flows (OBI `network` feature): kernel L4 topology + per-edge
    # health for workloads the L7 probes don't parse — map completeness WITHOUT
    # uprobes (no app-cgroup cost, unlike L7 instrumentation above). Off by
    # default. REQUIRES modules.infraMetrics (flows land in otel_metrics_*); a
    # chart guard enforces it. When on, the sensor pod also enables hostNetwork
    # so OBI can observe node flows.
    network:
      enabled: false
      # Per-edge connection health from OBI's TCP-stats metrics —
      # obi.stat.tcp.rtt (RTT) and obi.stat.tcp.failed.connections (resets/
      # failures) — surfaced on the service-map edges. Only effective when
      # network.enabled, and on by default with it.
      #
      # The features are named individually in the rendered config, NOT through
      # OBI's `stats` umbrella: that umbrella also carries stats_tcp_io, which
      # fires on every send and receive. Nothing here turns that on.
      stats: true
      # obi.stat.tcp.retransmits on the same edges: packet loss on the link,
      # which RTT alone does not reveal. Requires `stats`, and rides it by
      # default — it fires on retransmit, not per packet, so it costs about
      # what the failed-connection counter does. Needs OBI >= v0.12 (the metric
      # did not exist before, which is why network health shipped without it).
      retransmits: true
      # Cross-zone traffic accounting (OBI `network_inter_zone` feature): bytes
      # exchanged BETWEEN availability zones, per zone pair. Unlike `stats`
      # above this is effective ON ITS OWN — it activates the same kernel flow
      # pipeline without the per-edge `network` feature, so a cluster can have
      # the cloud bill explained without paying for per-workload flow metrics.
      # Cardinality is the number of zone pairs, not workload pairs.
      #
      # Zones come from the node label topology.kubernetes.io/zone; nodes
      # without it contribute flows the hub filters out. Same-zone traffic is
      # never counted (dropped at the sensor). REQUIRES modules.infraMetrics
      # (counters land in otel_metrics_*); a chart guard enforces it.
      #
      # COST: like network.enabled, this turns on hostNetwork for the sensor
      # pod. Whether the flow pipeline truly needs the host namespace is
      # unconfirmed — the requirement is inherited conservatively, not proven.
      # Marked experimental upstream, and Kubernetes-only.
      interZone:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # Green energy collection: CNCF Kepler (github.com/sustainable-computing-io/
  # kepler) joins the DaemonSet as a fourth pinned upstream container, opt-in. A
  # prometheus receiver in the otel-agent scrapes its energy endpoint onto the
  # existing OTLP → gateway → otel_metrics_* path (no new tables). Deliberately
  # module-named (unlike the component-named obi/profiler): it pairs with
  # modules.green and carries green-specific scrape config. REQUIRES
  # modules.green.enabled + modules.infraMetrics.enabled + sensor.agent.enabled;
  # chart guards enforce all three. The container gets NO liveness/readiness
  # probes on purpose — it must never flap the sensor pod (the "do no harm"
  # probe-canary gate) — but see kepler.enabled below: on a node with no RAPL
  # Kepler doesn't idle, it exits, and no probe config can save the pod from a
  # container that terminates itself.
  green:
    # The umbrella switch for the whole energy surface — Kepler, the estimator,
    # the scrape receiver, the metrics/green pipeline and the host mounts.
    enabled: false
    # Kepler itself, the MEASURED source. Turn OFF on nodes without RAPL
    # (VMs — the hypervisor doesn't expose the powercap MSRs): Kepler v0.11.4
    # exits with "no RAPL zones found" rather than sitting idle, so the
    # container crash-loops, the sensor pod never reports Ready, and `helm
    # --wait` / `kubectl rollout status` fail on an otherwise healthy sensor.
    # With this false, estimation.enabled below carries the Green screen alone
    # (a chart guard refuses to leave both sources off). The sensor's init
    # container prints which case a node is in before anything starts.
    kepler:
      enabled: true
    image:
      repository: quay.io/sustainable_computing_io/kepler
      # Pin exact — NEVER float to :latest. v0.11.x is the rebooted (Go) Kepler
      # line whose metric names match the AEP table; verify metric names/labels,
      # config keys and port on RAPL hardware before prod (design AEP limitation).
      tag: "v0.11.4"
    # Kepler's Prometheus port, bound to loopback (127.0.0.1) so only the
    # same-pod otel-agent can scrape it — never exposed on the pod network.
    # CAVEAT: with sensor.obi.network.enabled the sensor pod runs hostNetwork,
    # so this binds the HOST loopback — reachable by host-local processes, and
    # a host-side collision on the port crash-loops only the kepler container
    # (no probes, the pod itself is unaffected).
    port: 28282
    # How often the otel-agent scrapes Kepler's endpoint.
    scrapeInterval: 30s
    # privileged=true is the reliable default for reading RAPL/powercap across
    # runtimes and kernels. Set false to drop to a least-privilege capability
    # set (DAC_READ_SEARCH/SYS_PTRACE/PERFMON) instead — VERIFY on RAPL hardware
    # that those suffice for the powercap sysfs reads before relying on it.
    privileged: true
    # Kepler's dev fake-cpu-meter: synthesise energy where no RAPL exists (kind/
    # CI, most cloud VMs). Default false — v1 reports only what was measured; the
    # e2e-helm leg flips it true to prove do-no-harm with energy actually flowing.
    fakeCpuMeter: false
    metrics:
      # Only these Kepler series are kept (prometheus receiver relabel_config).
      # Matches the AEP metric table exactly; cpu_watts is collected for future
      # use, joules_total is what v1 queries. Keep in step with green.metrics.
      keep: "kepler_(node|pod)_cpu_(watts|joules_total)"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # TDP-based power estimation for RAPL-less nodes (opt-in, requires
    # sensor.green.enabled). See design/2026-07-28-green-tdp-estimation.md.
    # Every series it emits is stamped avuruobs_quality="estimated" by the
    # otel-agent — never blended with Kepler's measured numbers. On a RAPL-less
    # fleet this is the ONLY source: pair it with kepler.enabled=false above.
    estimation:
      enabled: false
      image:
        repository: ghcr.io/avuruvision/avuru-obs-tdp-estimator
        tag: "" # defaults to .Chart.AppVersion, like the other first-party images
      # Loopback-bound, like Kepler's own port (28282) — never exposed on the
      # pod network.
      port: 28283
      scrapeInterval: 30s
      # Operator-set P_idle/P_max override (Helm-values tier, wins over the
      # bundled table, loses to a per-node obs.avuru.io/power-*-watts
      # annotation). 0 = defer to the bundled table / generic fallback.
      idleWatts: 0
      maxWatts: 0
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

# Runtime collection control (design/2026-07-27-collection-control-plane.md):
# lets an admin toggle sensor signals + sensor.collection.excludeNamespaces
# from Settings -> Collection instead of only via `helm upgrade`. Default off
# — an install opts in deliberately (grants the hub a narrow, resourceName-
# scoped Role on its own sensor ConfigMaps + DaemonSet; see collection-rbac.
# yaml). When on, the hub reconciles saved overlays straight onto the sensor
# ConfigMaps and rolls the DaemonSet via a hub-owned checksum annotation.
collection:
  runtimeControl:
    enabled: false

# ClickHouse: single-node StatefulSet by default; flip external.enabled to BYO.
clickhouse:
  external:
    enabled: false
    address: "" # host:9000 (native protocol) when external.enabled
    # Any valid identifier — the migrations follow this name. It must ALREADY
    # EXIST on an external cluster: ClickHouse validates the database during the
    # connection handshake, so the migrator cannot create the one it is dialing.
    # (The in-chart StatefulSet creates `otel` on first start.)
    database: otel
    username: avuru
    existingSecret: "" # Secret with key `clickhouse-password`; overrides auth.password
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3"
  auth:
    username: avuru
    password: avuru # in-chart default — override or use existingSecret in prod
    existingSecret: ""
  persistence:
    enabled: true
    storageClassName: "" # "" = cluster default StorageClass
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi

# Projects the hub advertises to the UI switcher (the config-defined list).
# Tenants observed in the data are auto-discovered and
# merged; `default` always exists. Typically one entry per environment
# (matching each cluster's gateway.tenant) on a shared-ClickHouse install.
projects: []

# Authentication + project-scoped RBAC. Secure by default (v0.2): the hub
# rejects unauthenticated requests to every route except /healthz and the
# login endpoints. See the bootstrap password in the install NOTES.
auth:
  # Secure by default. `false` restores the fully-open pre-v0.2 behavior.
  enabled: true
  # Bootstrap admin password. Empty → a random one is generated into the
  # release Secret on first install and REUSED on upgrades (lookup).
  adminPassword: ""
  # Or bring your own Secret (key: admin-password); wins over adminPassword.
  existingSecret: ""
  sessionTTLHours: 168
  # CSRF: the hub rejects a write whose Origin doesn't match the Host it sees.
  # That comparison breaks behind a reverse proxy that REWRITES Host (handing
  # the cluster its ingress address instead of the public domain): the browser
  # sends the right Origin, the hub sees a Host that can never match it, and
  # every write — login included — 403s.
  #
  # trustedOrigins is the narrow fix: name the origin(s) users actually type,
  # and they pass while everything else is still rejected. Full origins, scheme
  # included: ["https://obs.example.com"]. When auth.oidc.publicUrl is set it is
  # trusted automatically — no need to repeat it.
  trustedOrigins: []
  # The blunt fix, when the origins cannot be enumerated (a LAN reached by IP,
  # several hostnames). enforce (default) rejects; log lets the write through
  # and logs the Origin/Host pair that would have been rejected — how you find
  # out what your proxy actually sends; off skips the check entirely. Anything
  # below enforce disarms a CSRF defense, so prefer trustedOrigins.
  originCheck: enforce
  # Anonymous, project-scoped read access (public demo). Both must be set.
  anonymous:
    role: ""        # "viewer" to enable
    projects: []    # explicit list — never implicit "*"
  # One-click read-only demo login ("Try the demo" on the login page): a
  # bootstrapped viewer scoped to the `demo` project. Opt-in — a normal install
  # ships no demo user or tenant. Pair with the Astronomy Shop overlay
  # (deploy/demo/astronomy) for live data. Requires auth.enabled.
  demo:
    enabled: false
    email: demo@avuru.obs
    # Demo viewer password. Empty → generated into the auth Secret and reused on
    # upgrades (like adminPassword). With auth.existingSecret set, add a
    # `demo-password` key to that Secret yourself.
    password: ""
  # Per-project ingest API keys, authenticated in the GATEWAY (not the hub — the
  # hub is never in the telemetry byte-path; it only answers the gateway's
  # control-plane validation call).
  #
  # mode is the rollout dial, and `log` is the safe default that keeps the
  # drop-in OTLP promise intact on upgrade:
  #   off      no key checking at all
  #   log      validate and count would-be denials, never reject, never stamp
  #            the tenant — an existing unkeyed sender keeps landing unchanged
  #   enforce  reject unkeyed/invalid OTLP, and the key's project becomes the
  #            authoritative tenant, overriding any client-supplied
  #            avuru.tenant (this is what replaces topology-based trust)
  #
  # Create keys in the UI (Settings → General → Ingest API keys) or via
  # POST /api/v1/projects/{project}/keys. The raw secret is shown exactly once.
  ingest:
    mode: log
    # Authenticates the gateway→hub validation call. Empty → generated into the
    # auth Secret on first install and reused on upgrades (like adminPassword).
    internalToken: ""
    # The sensor is itself an unkeyed OTLP sender, so enforce mode would silence
    # avuru's own agent. The chart therefore provisions a key for the sensor's
    # project and seeds it through the hub. Leave true unless you manage the
    # sensor's credential yourself.
    provisionSensorKey: true
    # Project the provisioned sensor key belongs to. Defaults to gateway.tenant
    # when set, else "default".
    sensorKeyProject: ""
    # Verdict cache bounds in the gateway. staleGrace lets a cached verdict keep
    # serving through a hub blip so a control-plane outage never drops telemetry.
    cacheTTL: 30s
    staleGrace: 5m
  # Enterprise SSO via any OpenID Connect IdP (Keycloak, Entra, Okta, Google,
  # Dex, ...). The hub runs the authorization-code + PKCE flow itself — no
  # oauth2-proxy, no extra pod. Register <publicUrl>/api/v1/auth/oidc/callback
  # as the client's redirect URL at the IdP. Everything below except enabled/
  # clientSecret/existingSecret/publicUrl is rendered into a ConfigMap the hub
  # hot-reloads within ~15s (`kubectl edit` re-runs discovery and re-maps
  # groups, no restart); IdP discovery is fail-loud at hub startup, so a wrong
  # issuer stops the rollout instead of silently shipping a broken login.
  # Requires auth.enabled (a chart guard enforces it).
  oidc:
    enabled: false
    # IdP issuer URL, exactly as the IdP states it —
    # <issuer>/.well-known/openid-configuration must resolve. Required.
    issuer: ""
    # OAuth2 client id registered with the IdP. Required.
    clientId: ""
    # Client secret in-values — labs only (it sits in your values in clear).
    # Prefer existingSecret in production; ignored when that is set.
    clientSecret: ""
    # Or bring your own Secret (key: oidc-client-secret); wins over
    # clientSecret. With NEITHER set the hub attempts a public (secret-less)
    # client — most IdPs refuse that for the code flow, so set one of the two.
    existingSecret: ""
    # ID-token claim carrying the user's groups ("groups" fits Keycloak/Okta/
    # Dex; Entra emits "roles" unless configured otherwise).
    groupsClaim: groups
    # IdP group → role-on-projects rules, applied at READ time on every
    # request — moving a user between IdP groups re-scopes them on their next
    # request, no re-login. Every matched rule contributes its grants.
    mapping: []
    #  - group: platform-team
    #    role: admin          # admin | editor | viewer
    #    projects: ["*"]      # explicit project list, or "*" for all
    #  - group: developers
    #    role: viewer
    #    projects: [staging]
    # Grants for an SSO user matching NO mapping rule: defaultRole on
    # defaultProjects. "" = such a login succeeds but sees zero projects.
    defaultRole: ""
    defaultProjects: []
    # Hide the local password form in the UI — SSO becomes the only visible
    # way in. The local admin API login keeps working as break-glass; flip
    # this only after the IdP round-trip is proven.
    forceSSO: false
    # External base URL of this install (e.g. https://obs.example.com — with
    # ingress.enabled typically https://<ingress.host>). Builds the absolute
    # redirect_uri the IdP requires (AVURUOBS_PUBLIC_URL); unset, the hub
    # degrades to a relative URL most IdPs reject (loud warning in its log).
    publicUrl: ""

# The schema migration Job (a post-install/post-upgrade Helm hook).
migrate:
  # Seconds the migrator waits for ClickHouse before failing. Raise it when the
  # database is slow to accept connections on a cold start (large volume
  # restore, external cluster still electing) — the Job failing here is one of
  # the ways an install ends up with no schema.
  clickhouseWaitSeconds: 60

# Per-signal retention in DAYS, applied as ClickHouse TTL by `hub migrate`, and
# reported by the hub (Settings -> Storage compares configured against enforced).
# These are the INSTALL-WIDE windows and the ceiling for a per-project one: a
# project can be given a SHORTER window in Settings -> General, which the hub
# enforces by trimming that tenant hourly. Longer than this is refused — the
# table TTL would drop the rows first regardless.
retention:
  traces: 7
  logs: 3
  metrics: 7
  profiles: 3
  # Errors keep longer: low volume after grouping, and issue history matters.
  errors: 30

ingress:
  enabled: false
  className: ""
  host: avuruobs.local
  # Hostname for Sentry SDK ingest, when gateway.sentry.enabled. It needs one
  # of its own: SDKs POST to /api/<project>/envelope/, which the main host
  # routes to the hub. "" = no ingress route (reach :4319 in-cluster, or via
  # your own). Put it in gateway.sentry.allowedOrigins' reach for browsers.
  sentryHost: ""
  annotations: {}
  tls: []

service:
  type: ClusterIP
