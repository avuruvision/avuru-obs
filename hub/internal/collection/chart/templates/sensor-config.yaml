{{- if and .Values.sensor.obi.network.enabled (not .Values.modules.infraMetrics.enabled) }}
{{- fail "sensor.obi.network.enabled requires modules.infraMetrics.enabled — OBI network flows are stored in the otel_metrics_* tables owned by the infra-metrics module." }}
{{- end }}
{{- if and .Values.sensor.obi.network.interZone.enabled (not .Values.modules.infraMetrics.enabled) }}
{{- fail "sensor.obi.network.interZone.enabled requires modules.infraMetrics.enabled — inter-zone byte counters are stored in the otel_metrics_* tables owned by the infra-metrics module." }}
{{- end }}
{{- /* Green's hard dependency, mirroring the hub's modules.Parse: the
       pod→workload energy join reads the kubeletstats resource attributes the
       infra-metrics module owns. Fire on the MODULE flag (unconditional, like
       the obi.network guard above) so a green install without infra-metrics
       fails at template time instead of crash-looping the hub. */}}
{{- if and .Values.modules.green.enabled (not .Values.modules.infraMetrics.enabled) }}
{{- fail "modules.green.enabled requires modules.infraMetrics.enabled — per-service energy attribution joins Kepler pods to workloads via the kubeletstats attributes stored in the otel_metrics_* tables owned by the infra-metrics module." }}
{{- end }}
{{- /* Collecting energy needs the otel-agent: the Kepler exporter is scraped by
       a prometheus receiver that lives in the agent container. Gated by
       sensor.enabled so values that render nothing (sensor off) never fail an
       install — the same discipline as the OBI optIn guards. */}}
{{- if and .Values.sensor.enabled (include "avuruobs.collectGreen" .) (not .Values.sensor.agent.enabled) }}
{{- fail "sensor.green.enabled requires sensor.agent.enabled — Kepler's energy metrics are scraped by a prometheus receiver in the otel-agent; with the agent off nothing collects them." }}
{{- end }}
{{- if and .Values.sensor.green.estimation.enabled (not .Values.sensor.green.enabled) }}
{{- fail "sensor.green.estimation.enabled requires sensor.green.enabled — sensor.green is the umbrella switch for the energy surface (receiver, pipeline, host mounts) that both sources share. To run the estimator alone on RAPL-less nodes keep sensor.green.enabled and set sensor.green.kepler.enabled=false." }}
{{- end }}
{{- /* Both sources off while the green surface renders would leave
       prometheus/green with an empty scrape_configs — an invalid collector
       config that crash-loops the otel-agent, i.e. a working sensor traded for
       an optional signal. Fail at template time instead, scoped like the
       agent guard above so values that render nothing never fail an install. */}}
{{- if and .Values.sensor.enabled (include "avuruobs.collectGreen" .) (not .Values.sensor.green.kepler.enabled) (not .Values.sensor.green.estimation.enabled) }}
{{- fail "sensor.green.enabled with sensor.green.kepler.enabled=false requires sensor.green.estimation.enabled — dropping Kepler leaves the estimator as the only energy source; with both off nothing collects, so turn sensor.green.enabled off instead." }}
{{- end }}
{{- /* $mode is read unconditionally (like the guards above) so it stays in
       scope for the data block below, which now sits under its own
       conditional — the resource itself may render as a placeholder. */}}
{{- $mode := .Values.sensor.obi.discovery.mode }}
{{- $obiActive := and .Values.sensor.enabled .Values.sensor.obi.enabled }}
{{- if $obiActive }}
{{- /* optIn guards live INSIDE the signal gate: values that produce no OBI
       config must never fail an install (e.g. optIn kept in a shared values
       file on a cluster that runs with the sensor off) — including the
       placeholder case below, where the ConfigMap renders but no discovery
       block does. */}}
{{- if eq $mode "optIn" }}
{{- if not .Values.sensor.collection.optOutLabel }}
{{- fail "sensor.obi.discovery.mode=optIn requires sensor.collection.optOutLabel — opt-in selects pods carrying that label set to \"true\"." }}
{{- end }}
{{- if not .Values.sensor.obi.discovery.namespaces }}
{{- fail "sensor.obi.discovery.mode=optIn requires a non-empty sensor.obi.discovery.namespaces — with no instrument entries the opt-in selector is never rendered and OBI falls back to its own discovery defaults." }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Renders whenever the signal is on OR runtime control needs the object to
       exist for the applier to update (it may never create). */}}
{{- if or $obiActive (include "avuruobs.collectionPlaceholders" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruobs.fullname" . }}-sensor-obi
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  obi-config.yml: |
{{- if $obiActive }}
    # Zero-code instrumentation scoped by sensor.collection / sensor.obi
    # .discovery values. The release's own namespace is ALWAYS excluded (the
    # platform must not trace itself); kube-system & co are excluded via
    # sensor.collection.excludeNamespaces rather than trusting OBI's
    # built-in defaults.
    discovery:
      instrument:
        {{- if eq $mode "optIn" }}
        # optIn: uprobes attach only to deliberately-labeled workloads —
        # each entry ANDs its namespace with the opt-in label (glob values,
        # full-string match in OBI v0.9.0).
        {{- end }}
        {{- range .Values.sensor.obi.discovery.namespaces }}
        - k8s_namespace: {{ . | quote }}
          {{- if eq $mode "optIn" }}
          k8s_pod_labels:
            {{ $.Values.sensor.collection.optOutLabel | quote }}: "true"
          {{- end }}
        {{- end }}
      exclude_instrument:
        - k8s_namespace: {{ .Release.Namespace | quote }}
        {{- range concat .Values.sensor.collection.excludeNamespaces .Values.sensor.obi.discovery.excludeNamespaces }}
        - k8s_namespace: {{ . | quote }}
        {{- end }}
        {{- if .Values.sensor.collection.optOutLabel }}
        # Per-pod escape hatch for probe-sensitive workloads.
        - k8s_pod_labels:
            {{ .Values.sensor.collection.optOutLabel | quote }}: "false"
        {{- end }}
    attributes:
      kubernetes:
        enable: true
    {{- if .Values.sensor.obi.network.enabled }}
      # Per-metric attribute sets. `include` REPLACES OBI's defaults for the
      # named metric, which is the point: left alone, flow bytes also carry
      # direction and per-interface labels, and the TCP-stats metrics carry
      # source and destination IP ADDRESSES — a series per address pair. Both
      # are pinned to the k8s owner keys the service map joins on.
      #
      # This `select` belongs to the SAME `attributes` mapping as `kubernetes`
      # above: OBI parses its config with strict YAML, where a second
      # `attributes:` key at this level is a load error that stops the process,
      # not a merge.
      select:
        obi.network.flow.bytes:
          include:
            - k8s.src.owner.name
            - k8s.src.namespace
            - k8s.dst.owner.name
            - k8s.dst.namespace
        {{- if .Values.sensor.obi.network.stats }}
        obi.stat.tcp.rtt:
          include:
            - k8s.src.owner.name
            - k8s.dst.owner.name
        obi.stat.tcp.failed.connections:
          include:
            - k8s.src.owner.name
            - k8s.dst.owner.name
        {{- end }}
    {{- end }}
    routes:
      # heuristic keeps http.route cardinality bounded (ids -> wildcards);
      # explicit because RED metric cardinality is a product concern.
      unmatched: heuristic
    {{- if or .Values.sensor.obi.network.enabled .Values.sensor.obi.network.interZone.enabled }}
    # Which metric families OBI exports, by the names in its own feature mapper
    # (v0.9.0 pkg/export/feature.go). Naming any feature REPLACES the default
    # list, which is ["application"] — hence application is repeated here so
    # turning flows on does not silently turn OBI's application metrics off.
    metrics:
      features:
        - application
        {{- if .Values.sensor.obi.network.enabled }}
        - network
        {{- end }}
        {{- if and .Values.sensor.obi.network.enabled .Values.sensor.obi.network.stats }}
        # TCP stats: obi.stat.tcp.rtt (RTT histogram) and
        # obi.stat.tcp.failed.connections (resets/failures). This list is the
        # ONLY switch for them — the stats config section has no `enable` key,
        # so nothing else turns them on.
        - stats
        {{- end }}
        {{- if .Values.sensor.obi.network.interZone.enabled }}
        # Cross-zone byte counters: obi.network.inter.zone.bytes, carrying
        # src.zone / dst.zone (from the node label topology.kubernetes.io/zone)
        # and nothing workload-shaped — bounded by the number of zone pairs, not
        # by the number of workload pairs. Same-zone flows are dropped at the
        # exporter, so the metric is cross-zone by construction. Standalone:
        # this entry activates the flows pipeline on its own, WITHOUT the
        # per-edge `network` feature.
        - network_inter_zone
        {{- end }}
    {{- end }}
    {{- if .Values.sensor.obi.network.enabled }}
    # Kernel L4 network flows: service-map completeness for workloads OBI's L7
    # probes don't parse — WITHOUT uprobes (no app-cgroup cost). Exported as the
    # OTLP metric obi.network.flow.bytes -> otel_metrics_sum, aggregated by k8s
    # workload identity (see attributes.select above) to bound cardinality.
    # `enable` is redundant with the feature list above and deprecated upstream,
    # but it is the switch that has actually been exercised, so both are set
    # until a cluster run says otherwise.
    network:
      enable: true
    {{- end }}
{{- else }}
    # Placeholder: signal disabled. Managed by runtime collection control —
    # the hub rewrites this ConfigMap when the signal is toggled on.
{{- end }}
{{- end }}
{{- /* The agent needs >=1 active pipeline or the collector crash-loops. A
       module gates its own collection (see avuruobs.collect* helpers). */}}
{{- $agentActive := and .Values.sensor.enabled .Values.sensor.agent.enabled (or (include "avuruobs.collectLogs" .) (include "avuruobs.collectInfraMetrics" .) (include "avuruobs.collectGreen" .)) }}
{{- if or $agentActive (include "avuruobs.collectionPlaceholders" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruobs.fullname" . }}-sensor-agent
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  config.yaml: |
{{- if $agentActive }}
    receivers:
    {{- if include "avuruobs.collectLogs" . }}
      filelog:
        # Zero-config stdout/stderr collection for every pod on the node,
        # EXCEPT this release's namespace (the platform must not ingest its
        # own logs: gateway error -> agent ships it -> gateway error ...) and
        # the shared sensor.collection.excludeNamespaces list.
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/{{ .Release.Namespace }}_*/*/*.log
        {{- range .Values.sensor.collection.excludeNamespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
        {{- end }}
        start_at: beginning
        storage: file_storage
        # The container operator's add_metadata_from_filepath (default: true)
        # reads log.file.path off each record — without this flag the receiver
        # never attaches it and every entry is dropped with "Failed to process
        # entry", i.e. zero pod logs ingested.
        include_file_path: true
        operators:
          # Parses containerd/cri-o/docker formats and promotes k8s.pod.name,
          # k8s.namespace.name, k8s.container.name, k8s.pod.uid from the file
          # path to resource attributes.
          - type: container
    {{- end }}
    {{- if include "avuruobs.collectInfraMetrics" . }}
      # Node/pod CPU, memory, network from this node's kubelet (Supporting
      # signal tier). Read-only stats API via the pod ServiceAccount.
      kubeletstats:
        auth_type: serviceAccount
        # Node IP, not node name: the pod resolves via cluster DNS
        # (ClusterFirstWithHostNet), which has no records for bare node
        # hostnames on most bare-metal clusters — the name variant fails
        # with "no such host" and kills the whole infra-metrics tier.
        endpoint: https://${env:K8S_NODE_IP}:10250
        # kubelet serving certs are typically self-signed per node
        insecure_skip_verify: true
        collection_interval: {{ .Values.sensor.agent.kubeletstats.interval }}
        metric_groups: [node, pod]
    {{- end }}
    {{- if include "avuruobs.collectGreen" . }}
      # Scrapes the same-pod Kepler exporter over loopback (Kepler binds
      # 127.0.0.1 — never exposed on the pod network; see the hostNetwork
      # caveat on sensor.green.port in values.yaml). The keep relabel drops
      # every SCRAPED series except the four Kepler energy metrics (the AEP
      # metric table). Prometheus's synthetic scrape-report series (up,
      # scrape_*) bypass metric_relabel_configs by design — filter/green in
      # the pipeline drops those. The pod→workload join happens later, at hub
      # query time, via the kubeletstats resource attributes.
      prometheus/green:
        config:
          scrape_configs:
              {{- if include "avuruobs.collectGreenMeasured" . }}
            - job_name: kepler
              scrape_interval: {{ .Values.sensor.green.scrapeInterval }}
              static_configs:
                - targets: ["127.0.0.1:{{ .Values.sensor.green.port }}"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: {{ .Values.sensor.green.metrics.keep | quote }}
                  action: keep
              {{- end }}
              {{- if include "avuruobs.collectGreenEstimation" . }}
            - job_name: tdp-estimator
              scrape_interval: {{ .Values.sensor.green.estimation.scrapeInterval }}
              static_configs:
                - targets: ["127.0.0.1:{{ .Values.sensor.green.estimation.port }}"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: {{ .Values.sensor.green.metrics.keep | quote }}
                  action: keep
              {{- end }}
    {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
          {{- if .Values.sensor.collection.optOutLabel }}
          labels:
            # Surfaces the per-pod opt-out label so filter/collection can
            # drop that pod's logs and metrics (same label OBI honors).
            - tag_name: avuru.obs.collect
              key: {{ .Values.sensor.collection.optOutLabel }}
              from: pod
          {{- end }}
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          {{- if include "avuruobs.collectGreen" . }}
          # Kepler energy carries no pod UID — associate on its promoted
          # k8s.pod.name/k8s.namespace.name (see groupbyattrs/green) so the
          # opt-out label reaches energy too. Ordered AFTER the UID rule, which
          # still wins for logs/kubeletstats (the first full match is used).
          - sources:
              - from: resource_attribute
                name: k8s.namespace.name
              - from: resource_attribute
                name: k8s.pod.name
          {{- end }}
      {{- if or .Values.sensor.collection.excludeNamespaces .Values.sensor.collection.optOutLabel }}
      # Collection guardrails: drop pod-scoped telemetry from excluded
      # namespaces and opted-out pods. Node-level metrics carry no
      # k8s.namespace.name attribute and are never dropped here.
      filter/collection:
        error_mode: ignore
        metrics:
          datapoint:
          {{- range .Values.sensor.collection.excludeNamespaces }}
            - resource.attributes["k8s.namespace.name"] == {{ . | quote }}
          {{- end }}
          {{- if .Values.sensor.collection.optOutLabel }}
            - resource.attributes["avuru.obs.collect"] == "false"
          {{- end }}
        logs:
          log_record:
          {{- range .Values.sensor.collection.excludeNamespaces }}
            - resource.attributes["k8s.namespace.name"] == {{ . | quote }}
          {{- end }}
          {{- if .Values.sensor.collection.optOutLabel }}
            - resource.attributes["avuru.obs.collect"] == "false"
          {{- end }}
      {{- end }}
      # Tailed logs carry no OTLP resource, so service.name is empty and the
      # Logs UI would show blank services — derive it from workload metadata.
      transform/service_name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
      {{- if include "avuruobs.collectGreen" . }}
      # Prometheus's synthetic scrape-report series (up, scrape_duration_seconds,
      # scrape_samples_scraped, scrape_samples_post_metric_relabeling,
      # scrape_series_added) are generated AFTER metric_relabel_configs, so the
      # receiver's keep relabel cannot drop them — without this they would land
      # in the shared otel_metrics_gauge (~5 series per node per scrape) that
      # the infra views query. Only Kepler energy may leave this pipeline.
      filter/green:
        error_mode: ignore
        metrics:
          metric:
            - IsMatch(name, "^(up|scrape_.+)$")
      # Green energy shaping. Kepler labels each pod datapoint pod_name/
      # pod_namespace (which the hub reads VERBATIM off the datapoint). Copy
      # them to the standard k8s.* keys so the shared k8sattributes and
      # filter/collection can govern energy the same way they govern logs and
      # kubeletstats. The originals are left in place for the hub read.
      transform/green:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["k8s.pod.name"], attributes[{{ .Values.green.metrics.podNameAttr | quote }}]) where attributes[{{ .Values.green.metrics.podNameAttr | quote }}] != nil
              - set(attributes["k8s.namespace.name"], attributes[{{ .Values.green.metrics.podNamespaceAttr | quote }}]) where attributes[{{ .Values.green.metrics.podNamespaceAttr | quote }}] != nil
      # Quality stamping: measured (Kepler, real RAPL) vs estimated
      # (tdp-estimator, modeled) — never inferred from absence, always an
      # explicit label on every datapoint (AEP). The prometheus receiver sets
      # resource.attributes["service.name"] from each scrape job's job_name —
      # confirmed empirically against the pinned otel/opentelemetry-
      # collector-contrib:0.154.0 image (see the AEP design spec §5.4).
      transform/green_quality:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              {{- if include "avuruobs.collectGreenMeasured" . }}
              - set(attributes["avuruobs_quality"], "measured") where resource.attributes["service.name"] == "kepler"
              {{- end }}
              {{- if include "avuruobs.collectGreenEstimation" . }}
              - set(attributes["avuruobs_quality"], "estimated") where resource.attributes["service.name"] == "tdp-estimator"
              {{- end }}
      # Promote the standard keys to resource attributes so k8sattributes can
      # associate the pod and filter/collection can match the namespace. The
      # datapoint keeps pod_name/pod_namespace (not listed here) for the hub.
      # Node energy (no pod attrs) simply groups on its own.
      groupbyattrs/green:
        keys:
          - k8s.pod.name
          - k8s.namespace.name
      # Node energy joins on ResourceAttributes['k8s.node.name'] — the key the
      # whole infra view relies on; upsert it from the node this sensor runs on.
      # Harmless on pod energy (queried by pod identity, not node).
      resource/green:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      {{- end }}
      batch:
        send_batch_size: 2048
        timeout: 2s
    exporters:
      otlphttp:
        endpoint: http://{{ include "avuruobs.fullname" . }}-gateway:4318
        {{- if and (include "avuruobs.ingestAuthEnabled" .) .Values.auth.ingest.provisionSensorKey }}
        # The sensor is itself an unkeyed OTLP sender, so without this header
        # flipping mode to enforce would silence avuru's own agent. Read from the
        # environment so the raw key stays out of this ConfigMap.
        headers:
          Authorization: "Bearer ${env:AVURUOBS_INGEST_KEY}"
        {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13134
      # filelog offset checkpoints survive agent restarts (no re-ingestion).
      file_storage:
        directory: /var/lib/otel-agent
    service:
      extensions: [health_check, file_storage]
      pipelines:
    {{- $collectionFilter := or .Values.sensor.collection.excludeNamespaces .Values.sensor.collection.optOutLabel }}
    {{- if include "avuruobs.collectLogs" . }}
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes{{ if $collectionFilter }}, filter/collection{{ end }}, transform/service_name, batch]
          exporters: [otlphttp]
    {{- end }}
    {{- if include "avuruobs.collectInfraMetrics" . }}
        metrics:
          # k8sattributes adds workload names (deployment/statefulset) to pod
          # metrics via k8s.pod.uid, for the pods panel.
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes{{ if $collectionFilter }}, filter/collection{{ end }}, batch]
          exporters: [otlphttp]
    {{- end }}
    {{- if include "avuruobs.collectGreen" . }}
        metrics/green:
          # Kepler energy on its OWN pipeline (separate from the kubeletstats
          # `metrics` pipeline so neither receiver's attributes bleed into the
          # other): scrape → standard-key shaping → shared k8sattributes +
          # collection guardrails → gateway, onto the existing otel_metrics_*
          # path. No new tables; the hub aggregates Wh/gCO2e at query time.
          receivers: [prometheus/green]
          processors: [memory_limiter, filter/green, transform/green, transform/green_quality, groupbyattrs/green, resource/green, k8sattributes{{ if $collectionFilter }}, filter/collection{{ end }}, batch]
          exporters: [otlphttp]
    {{- end }}
{{- else }}
    # Placeholder: signal disabled. Managed by runtime collection control —
    # the hub rewrites this ConfigMap when the signal is toggled on.
{{- end }}
{{- end }}
{{- $profilerActive := and .Values.sensor.enabled (include "avuruobs.collectProfiles" .) }}
{{- if or $profilerActive (include "avuruobs.collectionPlaceholders" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruobs.fullname" . }}-sensor-profiler
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  config.yaml: |
{{- if $profilerActive }}
    receivers:
      profiling:
        samples_per_second: {{ .Values.sensor.profiler.samplesPerSecond }}
    processors:
      # NO batch here: the batch processor does not support the profiles
      # signal in this collector line ("telemetry type is not supported" at
      # startup); the profiling receiver already reports in batches.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
      # Straight to the hub's profiles-ingest seam (OTLP/HTTP appends the
      # /v1development/profiles path) — documented profiles-only exception to
      # "the hub is never in the telemetry byte-path".
      otlphttp:
        endpoint: http://{{ include "avuruobs.fullname" . }}-hub:80
        {{- if .Values.gateway.tenant }}
        # Profiles bypass the gateway, so the project tag rides the ingest
        # header instead of the resource processor — same gateway.tenant
        # value, or profiles would split-brain into 'default'.
        headers:
          X-Avuru-Tenant: {{ .Values.gateway.tenant | quote }}
        {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13135
    service:
      extensions: [health_check]
      # The otel-agent collector in the SAME pod already binds the default
      # internal-telemetry port (127.0.0.1:8888); a second listener crashes.
      # v0.1 doesn't scrape collector self-metrics — disable them here.
      telemetry:
        metrics:
          level: none
      pipelines:
        profiles:
          receivers: [profiling]
          processors: [memory_limiter]
          exporters: [otlphttp]
{{- else }}
    # Placeholder: signal disabled. Managed by runtime collection control —
    # the hub rewrites this ConfigMap when the signal is toggled on.
{{- end }}
{{- end }}
{{- /* collectGreenMeasured, not collectGreen: Kepler is the MEASURED source and
       exits on a node with no RAPL zones, so sensor.green.kepler.enabled=false
       must drop its container AND its config. The placeholder arm still renders
       the (empty) ConfigMap when runtime collection control is on, because the
       hub can only rewrite a ConfigMap that already exists. */}}
{{- $keplerActive := and .Values.sensor.enabled (include "avuruobs.collectGreenMeasured" .) }}
{{- if or $keplerActive (include "avuruobs.collectionPlaceholders" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avuruobs.fullname" . }}-sensor-kepler
  labels:
    {{- include "avuruobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
data:
  # Kepler ({{ .Values.sensor.green.image.tag }}) — CPU energy from RAPL/powercap.
  # Host sysfs/procfs are bind-mounted read-only under /host (see the DaemonSet).
  # kube mode + the node name are passed on the CLI (--kube.enable
  # --kube.node-name); the Prometheus endpoint is bound to loopback so only the
  # same-pod otel-agent can reach it. These keys track the pinned Kepler and are
  # a documented verify-on-hardware item (design AEP) — confirm against RAPL.
  config.yaml: |
{{- if $keplerActive }}
    log:
      level: info
      format: text
    host:
      sysfs: /host/sys
      procfs: /host/proc
    exporter:
      prometheus:
        enabled: true
    web:
      listenAddresses:
        - 127.0.0.1:{{ .Values.sensor.green.port }}
    {{- if .Values.sensor.green.fakeCpuMeter }}
    # No-RAPL environments (kind/CI, most cloud VMs): synthesise energy so the
    # do-no-harm path can be proven with energy actually flowing (e2e-helm).
    # NEVER enable where real RAPL exists — it would fabricate measurements.
    dev:
      fake-cpu-meter:
        enabled: true
    {{- end }}
{{- else }}
    # Placeholder: signal disabled. Managed by runtime collection control —
    # the hub rewrites this ConfigMap when the signal is toggled on.
{{- end }}
{{- end }}
